<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generify Music — Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

        :root {
            --red:      #e8000f;
            --red-glow: rgba(232, 0, 15, 0.3);
            --bg:       #080a0c;
            --surface:  #0f1114;
            --surface2: #181b1f;
            --border:   rgba(232, 0, 15, 0.18);
            --border2:  rgba(255,255,255,0.07);
            --text:     #f0f0f0;
            --muted:    #6b7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(232,0,15,0.07) 0%, transparent 100%);
        }

        .header-left { display: flex; align-items: center; gap: 14px; }

        .wolf-logo {
            width: 44px; height: 44px;
            border-radius: 50%; object-fit: cover;
            box-shadow: 0 0 16px var(--red-glow);
        }

        .brand-name {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.8rem; letter-spacing: 0.12em;
            text-shadow: 0 0 20px var(--red-glow);
        }

        .brand-sub {
            font-size: 0.6rem; letter-spacing: 0.3em;
            text-transform: uppercase; color: var(--red); font-weight: 500;
        }

        .admin-badge {
            font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
            color: var(--muted); background: var(--surface2);
            border: 1px solid var(--border2); padding: 4px 10px; border-radius: 4px;
        }

        .back-link {
            font-size: 0.8rem; color: var(--muted); text-decoration: none;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--text); }

        main { max-width: 760px; margin: 0 auto; padding: 36px 20px 0; }

        .section-title {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.4rem; letter-spacing: 0.1em; margin-bottom: 20px;
        }

        /* ── Form card ── */
        .upload-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 28px; margin-bottom: 36px;
        }

        .edit-mode-banner {
            background: rgba(232,0,15,0.1); border: 1px solid rgba(232,0,15,0.3);
            border-radius: 6px; padding: 10px 14px; margin-bottom: 20px;
            font-size: 0.82rem; color: #f0a0a0;
            display: none; align-items: center; justify-content: space-between;
        }
        .edit-mode-banner.visible { display: flex; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }

        label {
            font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--muted); font-weight: 500;
        }

        input[type="text"] {
            background: var(--surface2); border: 1px solid var(--border2);
            border-radius: 6px; padding: 10px 14px; color: var(--text);
            font-size: 0.9rem; font-family: inherit; outline: none;
            transition: border-color 0.15s; width: 100%;
        }
        input[type="text"]:focus { border-color: rgba(232,0,15,0.5); }

        .drop-zone {
            background: var(--surface2); border: 1px dashed var(--border2);
            border-radius: 8px; padding: 24px; text-align: center;
            cursor: pointer; transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: rgba(232,0,15,0.5); background: rgba(232,0,15,0.04);
        }
        .drop-zone input[type="file"] {
            position: absolute; inset: 0; opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .drop-icon { font-size: 1.8rem; margin-bottom: 8px; }
        .drop-label { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
        .drop-label strong { color: var(--text); }
        .drop-label.has-file { color: #22c55e; }

        .file-preview { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }

        .file-chip {
            background: rgba(232,0,15,0.12); border: 1px solid rgba(232,0,15,0.3);
            border-radius: 4px; padding: 4px 10px; font-size: 0.75rem;
            display: flex; align-items: center; gap: 6px;
        }
        .file-chip button {
            background: none; border: none; color: var(--muted);
            cursor: pointer; font-size: 0.9rem; padding: 0; line-height: 1;
        }

        .cover-preview-wrap { margin-top: 10px; display: none; }
        .cover-preview-wrap img {
            width: 80px; height: 80px; border-radius: 6px;
            object-fit: cover; border: 1px solid var(--border);
        }

        .progress-bar-wrap {
            width: 100%; height: 3px; background: var(--surface2);
            border-radius: 2px; margin-top: 16px; display: none;
        }
        .progress-bar {
            height: 100%; background: var(--red); border-radius: 2px;
            width: 0%; transition: width 0.3s ease; box-shadow: 0 0 6px var(--red-glow);
        }

        .submit-row { display: flex; align-items: center; gap: 12px; margin-top: 24px; flex-wrap: wrap; }

        .btn { 
            border: none; font-family: inherit; font-size: 0.9rem; font-weight: 500;
            padding: 12px 24px; border-radius: 6px; cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: var(--red); color: white;
            box-shadow: 0 0 16px var(--red-glow);
        }
        .btn-primary:hover { background: #ff1a26; }
        .btn-primary:disabled { background: #4a0007; cursor: not-allowed; box-shadow: none; }
        .btn-secondary {
            background: var(--surface2); color: var(--muted);
            border: 1px solid var(--border2);
        }
        .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

        .status-msg { font-size: 0.85rem; color: var(--muted); }
        .status-msg.success { color: #22c55e; }
        .status-msg.error   { color: var(--red); }

        /* ── Library list ── */
        .album-list { display: flex; flex-direction: column; gap: 16px; }

        .album-row-item {
            background: var(--surface); border: 1px solid var(--border2);
            border-radius: 8px; overflow: hidden;
        }

        .album-row-main {
            padding: 14px 16px; display: flex;
            align-items: center; gap: 14px;
        }

        .album-row-thumb {
            width: 48px; height: 48px; border-radius: 6px;
            object-fit: cover; border: 1px solid var(--border); flex-shrink: 0;
        }

        .album-row-meta { flex: 1; min-width: 0; }
        .album-row-title { font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .album-row-sub   { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

        .album-row-genre {
            font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--red); background: rgba(232,0,15,0.1);
            border: 1px solid rgba(232,0,15,0.2); padding: 2px 8px;
            border-radius: 3px; flex-shrink: 0;
        }

        .album-row-actions { display: flex; gap: 8px; flex-shrink: 0; }

        .btn-icon {
            background: transparent; border: 1px solid var(--border2);
            color: var(--muted); width: 34px; height: 34px; border-radius: 6px;
            cursor: pointer; font-size: 0.85rem; display: flex;
            align-items: center; justify-content: center;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .btn-icon:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--surface2); }
        .btn-icon.danger:hover { background: rgba(232,0,15,0.15); color: var(--red); border-color: rgba(232,0,15,0.3); }
        .btn-icon.edit-active { background: rgba(232,0,15,0.15); color: var(--red); border-color: rgba(232,0,15,0.3); }

        /* ── Track list inside album ── */
        .track-list {
            border-top: 1px solid var(--border2);
            display: none;
        }
        .track-list.open { display: block; }

        .track-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.82rem;
        }
        .track-item:last-child { border-bottom: none; }

        .track-num {
            color: var(--muted); font-size: 0.75rem;
            width: 20px; text-align: right; flex-shrink: 0;
        }
        .track-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .empty-msg { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 0; }

        @media (max-width: 540px) {
            .form-row { grid-template-columns: 1fr; }
            .album-row-genre { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="/covers/wolf-logo.png" alt="Generify" class="wolf-logo" onerror="this.style.display='none'">
            <div>
                <div class="brand-name">Generify</div>
                <div class="brand-sub">Data Intelligence</div>
            </div>
            <span class="admin-badge">Admin</span>
        </div>
        <a href="/" class="back-link">← Library</a>
    </header>

    <main>
        <p class="section-title" id="form-title">Add New Album</p>

        <div class="upload-card">
            <!-- Edit mode banner -->
            <div class="edit-mode-banner" id="edit-banner">
                <span id="edit-banner-text">Editing album</span>
                <button class="btn btn-secondary" style="padding:6px 14px;font-size:0.8rem;" onclick="cancelEdit()">Cancel Edit</button>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Album Title</label>
                    <input type="text" id="title" placeholder="Album title">
                </div>
                <div class="form-group">
                    <label>Artist</label>
                    <input type="text" id="artist" placeholder="Artist name">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Genre</label>
                    <input type="text" id="genre" placeholder="Funny, Hip Hop, R&B…">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label id="cover-label">Album Cover</label>
                    <div class="drop-zone" id="cover-zone">
                        <input type="file" id="cover-input" accept="image/*">
                        <div class="drop-icon">🖼️</div>
                        <div class="drop-label" id="cover-drop-label"><strong>Tap to choose</strong> or drag image<br>JPG, PNG, WebP</div>
                    </div>
                    <div class="cover-preview-wrap" id="cover-preview-wrap">
                        <img id="cover-preview" src="" alt="Cover preview">
                    </div>
                </div>
                <div class="form-group">
                    <label id="tracks-label">Tracks (MP3)</label>
                    <div class="drop-zone" id="tracks-zone">
                        <input type="file" id="tracks-input" accept=".mp3,.m4a,.aac,.flac,.wav,.ogg,audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a" multiple>
                        <div class="drop-icon">🎵</div>
                        <div class="drop-label"><strong>Tap to choose</strong> or drag files<br>MP3, M4A, FLAC — multiple OK</div>
                    </div>
                    <div class="file-preview" id="tracks-preview"></div>
                </div>
            </div>

            <div class="progress-bar-wrap" id="progress-wrap">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="submit-row">
                <button class="btn btn-primary" id="submit-btn" onclick="submitForm()">Upload Album</button>
                <span class="status-msg" id="status-msg"></span>
            </div>
        </div>

        <p class="section-title">Library</p>
        <div class="album-list" id="album-list">
            <p class="empty-msg">Loading…</p>
        </div>
    </main>

    <script>
        // ── State ──────────────────────────────────────────
        let selectedCover  = null;
        let selectedTracks = [];
        let editingId      = null; // null = add mode, number = edit mode

        const coverInput  = document.getElementById('cover-input');
        const tracksInput = document.getElementById('tracks-input');

        // ── File inputs ────────────────────────────────────
        coverInput.addEventListener('change', () => {
            const file = coverInput.files[0];
            if (!file) return;
            selectedCover = file;
            const wrap  = document.getElementById('cover-preview-wrap');
            const img   = document.getElementById('cover-preview');
            const label = document.getElementById('cover-drop-label');
            img.src = URL.createObjectURL(file);
            wrap.style.display = 'block';
            label.innerHTML = `<strong>${file.name}</strong>`;
            label.classList.add('has-file');
        });

        tracksInput.addEventListener('change', () => {
            selectedTracks = Array.from(tracksInput.files);
            renderTrackChips();
        });

        function renderTrackChips() {
            const wrap = document.getElementById('tracks-preview');
            wrap.innerHTML = '';
            selectedTracks.forEach((f, i) => {
                const chip = document.createElement('div');
                chip.className = 'file-chip';
                chip.innerHTML = `${f.name} <button onclick="removeTrack(${i})">✕</button>`;
                wrap.appendChild(chip);
            });
        }

        function removeTrack(i) { selectedTracks.splice(i, 1); renderTrackChips(); }

        ['cover-zone','tracks-zone'].forEach(id => {
            const zone = document.getElementById(id);
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
            zone.addEventListener('drop', () => zone.classList.remove('dragover'));
        });

        // ── Edit mode ──────────────────────────────────────
        function startEdit(album) {
            editingId = album.id;
            document.getElementById('form-title').textContent = 'Edit Album';
            document.getElementById('submit-btn').textContent = 'Save Changes';
            document.getElementById('title').value  = album.title;
            document.getElementById('artist').value = album.artist;
            document.getElementById('genre').value  = album.genre || '';
            document.getElementById('cover-label').textContent  = 'Replace Cover (optional)';
            document.getElementById('tracks-label').textContent = 'Add More Tracks (optional)';

            // Show current cover
            const wrap = document.getElementById('cover-preview-wrap');
            const img  = document.getElementById('cover-preview');
            img.src = album.cover;
            wrap.style.display = 'block';

            // Show edit banner
            const banner = document.getElementById('edit-banner');
            document.getElementById('edit-banner-text').textContent = `Editing: ${album.title}`;
            banner.classList.add('visible');

            // Reset file selections
            selectedCover  = null;
            selectedTracks = [];
            coverInput.value  = '';
            tracksInput.value = '';
            document.getElementById('tracks-preview').innerHTML = '';
            document.getElementById('cover-drop-label').innerHTML = '<strong>Tap to choose new cover</strong><br>Leave blank to keep current';
            document.getElementById('cover-drop-label').classList.remove('has-file');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('form-title').textContent = 'Add New Album';
            document.getElementById('submit-btn').textContent = 'Upload Album';
            document.getElementById('cover-label').textContent  = 'Album Cover';
            document.getElementById('tracks-label').textContent = 'Tracks (MP3)';
            document.getElementById('edit-banner').classList.remove('visible');
            resetForm();
        }

        // ── Submit (add or edit) ───────────────────────────
        async function submitForm() {
            const title  = document.getElementById('title').value.trim();
            const artist = document.getElementById('artist').value.trim();
            const genre  = document.getElementById('genre').value.trim() || 'Other';
            const cover  = selectedCover || coverInput.files[0];
            const tracks = selectedTracks.length ? selectedTracks : Array.from(tracksInput.files);

            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('status-msg');

            // Validate
            if (editingId === null) {
                if (!title || !artist || !cover || !tracks.length) {
                    msg.className = 'status-msg error';
                    msg.textContent = 'Please fill in all fields and select cover + at least one track.';
                    return;
                }
            } else {
                if (!title || !artist) {
                    msg.className = 'status-msg error';
                    msg.textContent = 'Title and artist are required.';
                    return;
                }
            }

            btn.disabled = true;
            msg.className = 'status-msg';
            msg.textContent = editingId ? 'Saving…' : 'Uploading…';

            const progressWrap = document.getElementById('progress-wrap');
            const progressBar  = document.getElementById('progress-bar');
            progressWrap.style.display = 'block';
            let pct = 0;
            const ticker = setInterval(() => { pct = Math.min(pct + 3, 85); progressBar.style.width = pct + '%'; }, 200);

            try {
                const form = new FormData();
                form.append('title',  title);
                form.append('artist', artist);
                form.append('genre',  genre);
                if (cover) form.append('cover', cover);
                tracks.forEach(t => form.append('tracks', t));

                const endpoint = editingId
                    ? `/api/upload/album/${editingId}`
                    : '/api/upload/album';
                const method = editingId ? 'PUT' : 'POST';

                const res  = await fetch(endpoint, { method, body: form });
                const data = await res.json();

                clearInterval(ticker);
                progressBar.style.width = '100%';

                if (data.success) {
                    msg.className = 'status-msg success';
                    msg.textContent = editingId ? `✓ "${title}" updated.` : `✓ "${title}" added.`;
                    cancelEdit();
                    loadAlbums();
                } else {
                    msg.className = 'status-msg error';
                    msg.textContent = `Error: ${data.error}`;
                }
            } catch (err) {
                clearInterval(ticker);
                msg.className = 'status-msg error';
                msg.textContent = `Failed: ${err.message}`;
            } finally {
                btn.disabled = false;
                setTimeout(() => { progressWrap.style.display = 'none'; progressBar.style.width = '0%'; }, 1500);
            }
        }

        function resetForm() {
            document.getElementById('title').value  = '';
            document.getElementById('artist').value = '';
            document.getElementById('genre').value  = '';
            coverInput.value  = '';
            tracksInput.value = '';
            selectedCover  = null;
            selectedTracks = [];
            document.getElementById('cover-preview-wrap').style.display = 'none';
            document.getElementById('tracks-preview').innerHTML = '';
            document.getElementById('cover-drop-label').innerHTML = '<strong>Tap to choose</strong> or drag image<br>JPG, PNG, WebP';
            document.getElementById('cover-drop-label').classList.remove('has-file');
        }

        // ── Load library ───────────────────────────────────
        async function loadAlbums() {
            const list = document.getElementById('album-list');
            try {
                const res    = await fetch('/api/albums');
                const albums = await res.json();

                if (!albums.length) {
                    list.innerHTML = '<p class="empty-msg">No albums yet.</p>';
                    return;
                }

                list.innerHTML = '';
                albums.forEach(album => {
                    const item = document.createElement('div');
                    item.className = 'album-row-item';
                    item.id = `album-item-${album.id}`;

                    // Track list HTML
                    const trackRows = album.tracks.map((t, i) => `
                        <div class="track-item">
                            <span class="track-num">${i + 1}</span>
                            <span class="track-name">${t.title}</span>
                            <button class="btn-icon danger" title="Delete track"
                                onclick="deleteTrack(${album.id}, ${i}, '${t.title.replace(/'/g,"\\'")}', this)">🗑</button>
                        </div>
                    `).join('');

                    item.innerHTML = `
                        <div class="album-row-main">
                            <img class="album-row-thumb" src="${album.cover}" alt="${album.title}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%230f1114%22 width=%221%22 height=%221%22/></svg>'">
                            <div class="album-row-meta">
                                <div class="album-row-title">${album.title}</div>
                                <div class="album-row-sub">${album.artist} · ${album.tracks.length} track${album.tracks.length !== 1 ? 's' : ''}</div>
                            </div>
                            <span class="album-row-genre">${album.genre || 'Other'}</span>
                            <div class="album-row-actions">
                                <button class="btn-icon" title="Show tracks"
                                    onclick="toggleTracks(${album.id}, this)">▾</button>
                                <button class="btn-icon" title="Edit album"
                                    onclick="startEdit(${JSON.stringify(album).replace(/"/g,'&quot;')})">✏️</button>
                                <button class="btn-icon danger" title="Delete album"
                                    onclick="deleteAlbum(${album.id}, '${album.title.replace(/'/g,"\\'")}')">🗑</button>
                            </div>
                        </div>
                        <div class="track-list" id="tracks-${album.id}">
                            ${trackRows || '<p class="empty-msg" style="padding:12px">No tracks</p>'}
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                list.innerHTML = `<p class="empty-msg">Could not load: ${err.message}</p>`;
            }
        }

        // ── Toggle track list ──────────────────────────────
        function toggleTracks(albumId, btn) {
            const tl = document.getElementById(`tracks-${albumId}`);
            tl.classList.toggle('open');
            btn.textContent = tl.classList.contains('open') ? '▴' : '▾';
        }

        // ── Delete album ───────────────────────────────────
        async function deleteAlbum(id, title) {
            if (!confirm(`Delete "${title}"? This removes it from the library.`)) return;
            try {
                const res  = await fetch(`/api/remove/album/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) loadAlbums();
                else alert(`Delete failed: ${data.error}`);
            } catch (err) { alert(`Delete failed: ${err.message}`); }
        }

        // ── Delete track ───────────────────────────────────
        async function deleteTrack(albumId, trackIndex, trackTitle, btn) {
            if (!confirm(`Delete track "${trackTitle}"?`)) return;
            btn.disabled = true;
            try {
                const res  = await fetch(`/api/remove/track/${albumId}/${trackIndex}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) loadAlbums();
                else { alert(`Track delete failed: ${data.error}`); btn.disabled = false; }
            } catch (err) { alert(`Track delete failed: ${err.message}`); btn.disabled = false; }
        }

        loadAlbums();
    </script>
</body>
</html>
