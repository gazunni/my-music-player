<script>
    // --- PASTE YOUR ALBUM DATA HERE ---
    const albums = [
      {
        "id": 1,
        "title": "Don't Ask The Mango",
        "artist": "Vegetarian Aardvark",
        "cover": "https://covers.generify.ca/mango.png",
        "tracks": [
          { "title": "Don't Ask the Mango", "url": "https://music.generify.ca/funny/dontaskthemango.mp3" }
        ]
      }
    ];
    // ----------------------------------

    console.log("Script started. Found " + albums.length + " albums.");

    const grid = document.getElementById('album-grid');
    if (!grid) {
        console.error("Grid element not found!");
    } else {
        grid.innerHTML = ''; // Clear loading text

        albums.forEach((album, albumIndex) => {
            console.log("Rendering album:", album.title);
            const card = document.createElement('div');
            card.className = 'album-card';
            
            // Use a placeholder if cover fails to load
            const coverSrc = album.cover || 'https://via.placeholder.com/150?text=No+Cover';
            
            card.innerHTML = `
                <img src="${coverSrc}" class="album-cover" alt="${album.title}" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
                <div class="album-info">
                    <div class="album-title">${album.title}</div>
                    <div class="album-artist">${album.artist}</div>
                </div>
            `;
            
            // Click to play album
            card.onclick = () => loadAlbum(album, albumIndex);
            grid.appendChild(card);
        });
    }

    // 2. Player Logic
    let currentTracks = [];
    let currentTrackIndex = 0;
    let currentAlbumData = null; 
    
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playerBar = document.getElementById('player-bar');

    function loadAlbum(album, index) {
        console.log("Loading album:", album.title);
        currentTracks = album.tracks;
        currentAlbumData = album; 
        currentTrackIndex = 0;
        playTrack(0);
    }

    function playTrack(index) {
        if (!currentAlbumData) {
            console.error("No album data loaded!");
            return;
        }
        
        const track = currentTracks[index];
        document.getElementById('current-title').innerText = track.title;
        document.getElementById('current-artist').innerText = currentAlbumData.artist;
        document.getElementById('current-cover').src = currentAlbumData.cover;
        
        audio.src = track.url;
        // Handle autoplay policy (user must interact first)
        audio.play().catch(e => console.error("Autoplay blocked. User must click first.", e));
        playBtn.innerText = '⏸';
        playerBar.style.display = 'flex';
    }

    playBtn.onclick = () => {
        if (audio.paused) {
            audio.play();
            playBtn.innerText = '⏸';
        } else {
            audio.pause();
            playBtn.innerText = '▶';
        }
    };

    document.getElementById('next-btn').onclick = () => {
        if (currentTrackIndex < currentTracks.length - 1) {
            playTrack(currentTrackIndex + 1);
        }
    };

    document.getElementById('prev-btn').onclick = () => {
        if (currentTrackIndex > 0) {
            playTrack(currentTrackIndex - 1);
        }
    };
    
    // Auto-play next when song ends
    audio.onended = () => {
        if (currentTrackIndex < currentTracks.length - 1) {
            playTrack(currentTrackIndex + 1);
        }
    };
</script>
