<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
        }
        .player-card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 300px;
        }
        h2 { margin-top: 0; }
        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
        }
        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h2>Don't Ask the Mango</h2>
        <!-- REPLACE THE SRC BELOW WITH YOUR R2 URL -->
        <audio id="myAudio" controls>
            <source src="https://pub-412b9b0e4a88453f9f8a294aa6494755.r2.dev/funny/don%E2%80%99t-ask-the-mango.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <div class="status">Click play!</div>
    </div>

    <script>
        const audio = document.getElementById('myAudio');
        
        audio.addEventListener('play', () => {
            console.log("Music started!");
        });

        audio.addEventListener('ended', () => {
            console.log("Song finished.");
        });
    </script>
</body>
</html>
