<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Generify Music</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
        :root {
            --red:      #e8000f;
            --red-glow: rgba(232, 0, 15, 0.35);
            --bg:       #080a0c;
            --surface:  #0f1114;
            --surface2: #181b1f;
            --border:   rgba(232, 0, 15, 0.18);
            --text:     #f0f0f0;
            --muted:    #6b7280;
            --player-h: 88px;
            --card-w:   160px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(var(--player-h) + 24px);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* ── Header / Emotional Lens Masthead ── */
        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 142px;
            padding: 22px clamp(24px, 4vw, 50px);
            border-bottom: 1px solid var(--border);
            background:
                radial-gradient(circle at 6% 18%, rgba(232,0,15,0.14), transparent 28%),
                linear-gradient(180deg, rgba(232,0,15,0.055) 0%, rgba(8,10,12,0.96) 100%);
            z-index: 210;
            gap: 24px;
        }

        header::after {
            content: '';
            position: absolute;
            inset: auto 0 0 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(232,0,15,0.42), transparent);
            pointer-events: none;
        }

        .masthead-text {
            position: relative;
            max-width: 760px;
            padding-left: 22px;
        }

        .masthead-text::before {
            content: '';
            position: absolute;
            left: 0;
            top: 3px;
            bottom: 5px;
            width: 1px;
            background: rgba(232,0,15,0.82);
            box-shadow: 0 0 22px rgba(232,0,15,0.24);
        }

        .masthead-text .lens-kicker {
            font-size: 0.64rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 6px;
        }

        .masthead-text .lens-heading {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: clamp(2.35rem, 5.8vw, 4.25rem);
            letter-spacing: 0.105em;
            line-height: 0.94;
            color: var(--text);
            text-shadow: 0 0 30px rgba(232,0,15,0.24);
        }

        .masthead-text .lens-copy {
            max-width: 720px;
            color: rgba(255,255,255,0.76);
            font-size: clamp(0.8rem, 1.35vw, 0.94rem);
            line-height: 1.42;
            margin-top: 9px;
        }

        .wolf-logo {
            width: clamp(66px, 8vw, 94px);
            height: clamp(66px, 8vw, 94px);
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin-left: auto;
            box-shadow: 0 0 0 1px rgba(232,0,15,0.42), 0 0 24px var(--red-glow), 0 0 74px rgba(232,0,15,0.22);
            animation: pulse-ring 3s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 1px rgba(232,0,15,0.42), 0 0 24px var(--red-glow), 0 0 74px rgba(232,0,15,0.22); }
            50%       { box-shadow: 0 0 0 1px rgba(232,0,15,0.68), 0 0 36px rgba(232,0,15,0.55), 0 0 92px rgba(232,0,15,0.28); }
        }

        /* ── Main ── */
        main {
            max-width: 1160px;
            margin: 0 auto;
            padding: 18px 20px 0;
            position: relative;
            z-index: 1;
        }

        /* ── Genre Row ── */
        .genre-section { margin-bottom: 28px; }

        .genre-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 12px;
            padding-left: 2px;
        }

        .genre-title {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.08em;
            color: var(--text);
        }

        .genre-count {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .genre-rule { flex: 1; height: 1px; background: var(--border); }


        /* ── Emotional Lenses ── */
        .lens-kicker {
            font-size: 0.64rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 6px;
        }
        .lens-heading {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: clamp(2rem, 5vw, 3.7rem);
            letter-spacing: 0.1em;
            line-height: 0.95;
            text-shadow: 0 0 28px rgba(232,0,15,0.28);
        }
        .lens-copy {
            max-width: 660px;
            color: rgba(255,255,255,0.62);
            font-size: 0.88rem;
            line-height: 1.55;
            margin-top: 8px;
        }
        .lens-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
            gap: 14px;
            padding: 0 2px 18px;
        }
        .lens-gallery.room-mode {
            display: block;
            position: sticky;
            top: 0;
            z-index: 50;
            padding-top: calc(56px + env(safe-area-inset-top, 0px));
            padding-bottom: 14px;
            background: rgba(8,10,12,0.94);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(232,0,15,0.18);
        }
        .lens-card {
            position: relative;
            min-height: 132px;
            text-align: left;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.13);
            border-radius: 20px;
            background: radial-gradient(circle at 18% 0%, rgba(232,0,15,0.24), transparent 42%), linear-gradient(135deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));
            color: white;
            cursor: pointer;
            padding: 15px 15px 13px;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }
        .lens-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--lens-image), var(--lens-art, radial-gradient(circle, rgba(232,0,15,0.2), transparent 55%));
            background-size: cover;
            background-position: center;
            opacity: 0.78;
            filter: saturate(1.05) contrast(1.03);
            transform: scale(1.01);
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        .lens-card::after {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(circle at 18% 0%, rgba(232,0,15,0.16), transparent 38%),
                linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.72));
        }
        .lens-card:hover {
            transform: translateY(-3px);
            border-color: rgba(232,0,15,0.52);
            box-shadow: 0 16px 44px rgba(232,0,15,0.12);
        }
        .lens-card:hover::before { opacity: 0.94; transform: scale(1.06); }
        .lens-card.active {
            border-color: rgba(232,0,15,0.85);
            box-shadow: 0 0 0 1px rgba(232,0,15,0.45), 0 16px 52px rgba(232,0,15,0.18);
        }
        .lens-card-title, .lens-card-desc, .lens-card-count { position: relative; z-index: 1; }
        .lens-card-title {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.24rem;
            letter-spacing: 0.08em;
            line-height: 1;
        }
        .lens-card-desc {
            color: rgba(255,255,255,0.72);
            font-size: 0.68rem;
            line-height: 1.28;
            margin-top: 7px;
        }
        .lens-card-count {
            display: inline-block;
            margin-top: 10px;
            color: rgba(255,255,255,0.52);
            font-size: 0.58rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .lens-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding: 0 2px 18px;
            flex-wrap: wrap;
        }
        .lens-room-top {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) auto;
            align-items: center;
            gap: 14px;
            padding: 0 2px 14px;
        }
        .lens-room-badge {
            position: relative;
            overflow: hidden;
            width: min(430px, 100%);
            border-radius: 18px;
            border: 1px solid rgba(232,0,15,0.42);
            padding: 12px 15px;
            background: rgba(0,0,0,0.32);
            box-shadow: 0 16px 48px rgba(0,0,0,0.24);
        }
        .lens-room-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--lens-image), var(--lens-art);
            background-size: cover;
            background-position: center;
            opacity: 0.42;
        }
        .lens-room-badge::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.76), rgba(0,0,0,0.34));
        }
        .lens-room-badge > * { position: relative; z-index: 1; }
        .lens-room-label {
            font-size: 0.58rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.6);
            margin-bottom: 4px;
        }
        .lens-room-title {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.48rem;
            letter-spacing: 0.09em;
        }
        .lens-room-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }
        .lens-door {
            border-color: rgba(255,255,255,0.18) !important;
            background: rgba(255,255,255,0.055) !important;
            color: rgba(255,255,255,0.7) !important;
        }
        .lens-door:hover {
            color: white !important;
            border-color: rgba(255,255,255,0.38) !important;
        }
        .lens-landing-prompt {
            margin: 6px 2px 28px;
            padding: 18px;
            border: 1px dashed rgba(255,255,255,0.13);
            border-radius: 18px;
            color: rgba(255,255,255,0.56);
            line-height: 1.5;
            background: rgba(255,255,255,0.025);
        }
        .track-lens {
            display: inline-block;
            margin-top: 6px;
            color: rgba(232,0,15,0.86);
            font-size: 0.56rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }


        /* ── Filter Pills ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 2px 20px;
        }

        .filter-pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.18);
            color: #c0c0c0;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .filter-pill:hover { border-color: rgba(232,0,15,0.6); background: rgba(255,255,255,0.1); color: white; }

        .filter-pill.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
            box-shadow: 0 0 12px var(--red-glow);
        }

        .filter-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }

        .action-pill {
            background: transparent;
            border: 1px solid rgba(232,0,15,0.4);
            color: var(--red);
            font-family: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-pill:hover { background: var(--red); color: white; }

        .album-row {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .album-row::-webkit-scrollbar { height: 3px; }
        .album-row::-webkit-scrollbar-track { background: var(--surface); }
        .album-row::-webkit-scrollbar-thumb { background: #7a000a; border-radius: 2px; }


        /* Share toast */
        .share-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(20,22,26,0.95);
            border: 1px solid rgba(232,0,15,0.3);
            color: var(--text);
            font-size: 0.82rem;
            padding: 10px 20px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 300;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Album Card ── */
        .album-card {
            flex: 0 0 var(--card-w);
            width: var(--card-w);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            animation: fadeUp 0.4s ease both;
        }

        .album-card:hover { transform: translateY(-4px); border-color: rgba(232,0,15,0.5); box-shadow: 0 8px 32px rgba(232,0,15,0.15); }

        .album-card.active { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 8px 32px rgba(232,0,15,0.25); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .album-cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
        }

        /* Music-note placeholder when cover fails to load */
        .album-cover-wrap.no-cover {
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .album-cover-wrap.no-cover::after {
            content: '♪';
            font-size: 2.6rem;
            color: var(--muted);
            opacity: 0.45;
        }

        .album-cover {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .album-card:hover .album-cover { transform: scale(1.06); }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .album-card:hover .play-overlay { opacity: 1; }

        .play-overlay svg { width: 44px; height: 44px; filter: drop-shadow(0 0 8px rgba(232,0,15,0.8)); }

        .album-info { padding: 10px 12px 12px; }

        /* ── Marquee for overflowing titles ── */
        .album-title {
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 3px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .album-title-inner {
            display: inline-block;
            white-space: nowrap;
        }

        .album-card:hover .album-title-inner.overflows {
            animation: marquee 6s linear infinite;
        }

        @keyframes marquee {
            0%   { transform: translateX(0); }
            25%  { transform: translateX(0); }
            75%  { transform: translateX(var(--marquee-offset, -40%)); }
            100% { transform: translateX(var(--marquee-offset, -40%)); }
        }

        .album-artist {
            font-size: 0.74rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Track duration shown below artist on card */
        .album-duration {
            font-size: 0.67rem;
            color: var(--muted);
            margin-top: 3px;
            opacity: 0.65;
        }

        .state-msg {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 40px 0;
            text-align: center;
        }

        /* ── Player Bar ── */
        .player-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--player-h);
            background: rgba(10,11,13,0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
            z-index: 100;
        }

        .player-bar.visible { display: flex; }

        /* ── Seekable progress strip replacing the old ::before pseudo trick ── */
        .player-seek-wrap {
            position: absolute;
            top: -5px; left: 0; right: 0;
            height: 10px;      /* generous tap/click area */
            cursor: pointer;
            z-index: 2;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .player-seek-track {
            position: absolute;
            top: 4px; left: 0; right: 0;
            height: 2px;
            background: rgba(255,255,255,0.08);
        }
        .player-seek-fill {
            height: 100%;
            width: 0%;
            background: var(--red);
            box-shadow: 0 0 8px var(--red-glow);
            pointer-events: none;
            transition: width 0.5s linear;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .player-thumb {
            width: 48px; height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
            cursor: pointer;
        }

        /* Placeholder when thumb fails */
        .player-thumb-placeholder {
            width: 48px; height: 48px;
            border-radius: 6px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            cursor: pointer;
            background: var(--surface2);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: var(--muted);
        }
        .player-thumb-placeholder.visible { display: flex; }

        .player-meta { min-width: 0; }

        /* Marquee on bar track title */
        .player-track {
            font-weight: 500;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .player-track-inner {
            display: inline-block;
            white-space: nowrap;
        }

        .player-track-inner.overflows {
            animation: marquee 8s linear infinite;
        }

        .player-artist {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Up Next line */
        .player-up-next {
            font-size: 0.63rem;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.03em;
        }
        .player-up-next em {
            font-style: normal;
            color: rgba(232,0,15,0.85);
            font-weight: 500;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            padding: 7px 10px;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(0,0,0,0.18));
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 34px rgba(0,0,0,0.28);
        }

        .ctrl-btn {
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.68);
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease, transform 0.1s ease, box-shadow 0.16s ease;
            font-size: 0;
            line-height: 0;
        }

        .ctrl-btn svg {
            width: 18px;
            height: 18px;
            display: block;
            fill: currentColor;
        }

        .ctrl-btn:hover {
            color: var(--text);
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18);
            box-shadow: 0 0 14px rgba(255,255,255,0.05);
        }

        .ctrl-btn.primary {
            width: 46px; height: 46px;
            background: radial-gradient(circle at 50% 38%, #ff2834 0%, var(--red) 56%, #8e0008 100%);
            color: white;
            border-color: rgba(255,46,58,0.52);
            box-shadow: 0 0 0 1px rgba(232,0,15,0.28), 0 0 18px var(--red-glow), inset 0 1px 0 rgba(255,255,255,0.22);
        }

        .ctrl-btn.primary svg { width: 20px; height: 20px; }
        .ctrl-btn.primary:hover {
            background: radial-gradient(circle at 50% 38%, #ff414b 0%, #f00012 58%, #9b0009 100%);

        /* ── Now Playing Modal ── */
        .now-playing-overlay {

            align-items: center;

            background: rgba(0,0,0,0.82);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .now-playing-card {
            position: relative;
            width: min(560px, 92vw);
            border-radius: 20px;
            overflow: hidden;
            transform: scale(0.3) translateY(60px);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        .now-playing-overlay.open .now-playing-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .np-cover {
            width: 100%;
            height: 100%;
            min-height: 320px;
            object-fit: cover;
            display: block;
        }

        /* Music-note placeholder for modal cover */
        /* Cover wrapper — positioned so overlay elements anchor correctly */
        .np-cover-wrap {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .np-cover-placeholder {
            width: 100%;
            min-height: 320px;
            background: var(--surface2);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            color: var(--muted);
            opacity: 0.35;

        .np-cover-placeholder.visible { display: flex; }

        /* ── Teleprompter Lyrics ── */
        .np-lyrics-window {
            overflow: hidden;
            position: relative;
            display: none;
            height: 140px;
        }
        .np-lyrics-window.visible {
            display: block;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
        }
        .np-lyrics-scroll {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        /* Fluid lyric line sizing — scales with container width */
        .lyric-line[data-dist="0"] {
            font-size: clamp(0.9rem, 2.2vw, 1.05rem);
        }
        .lyric-line[data-dist="-1"],
        .lyric-line[data-dist="1"] {
            font-size: clamp(0.75rem, 1.8vw, 0.85rem);
        }
        .lyric-line[data-dist="-2"],
        .lyric-line[data-dist="2"] {
            font-size: clamp(0.65rem, 1.5vw, 0.75rem);
        }
        .lyric-line[data-dist="-3"],
        .lyric-line[data-dist="3"],
        .lyric-line[data-dist-far] {
            font-size: clamp(0.6rem, 1.3vw, 0.7rem);
        }
        .lyric-line {
            text-align: center;
            width: 100%;
            padding: 3px 6px;
            line-height: 1.5;
            font-size: 0.85rem;
            transition:
                font-size   0.45s cubic-bezier(0.4, 0, 0.2, 1),
                font-weight 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                color       0.45s cubic-bezier(0.4, 0, 0.2, 1),
                opacity     0.45s cubic-bezier(0.4, 0, 0.2, 1),
                filter      0.45s cubic-bezier(0.4, 0, 0.2, 1),
                text-shadow 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lyric-line[data-dist="0"] {
            font-size: 1.05rem; font-weight: 700;
            color: #ffe8e8; opacity: 1; filter: none;
            text-shadow:
                0 0 8px rgba(232,0,15,1),
                0 0 20px rgba(232,0,15,0.8),
                0 0 40px rgba(232,0,15,0.4);
        }
        .lyric-line[data-dist="-1"] {
            font-size: 0.85rem; font-weight: 400;
            color: rgba(255,255,255,0.75); opacity: 1; filter: none;
            text-shadow: none;
        }
        .lyric-line[data-dist="1"] {
            font-size: 0.85rem; font-weight: 400;
            color: rgba(255,255,255,0.55); opacity: 0.9; filter: none;
            text-shadow: none;
        }
        .lyric-line[data-dist="-2"],
        .lyric-line[data-dist="2"] {
            font-size: 0.75rem; font-weight: 400;
            color: rgba(255,255,255,0.3); opacity: 0.7;
            filter: blur(0.5px); text-shadow: none;
        }
        .lyric-line[data-dist="-3"],
        .lyric-line[data-dist="3"] {
            font-size: 0.7rem; font-weight: 400;
            color: rgba(255,255,255,0.15); opacity: 0.5;
            filter: blur(1px); text-shadow: none;
        }
        .lyric-line[data-dist-far] {
            font-size: 0.65rem; font-weight: 400;
            color: rgba(255,255,255,0.08); opacity: 0.3;
            filter: blur(1.5px); text-shadow: none;
        }

        .np-gradient {

        .np-progress-wrap {

        .np-progress-wrap::before {

        /* Thumb dot — only on modal bar, not panel bar */
        #np-progress-wrap .np-progress-bar::after,
        #np-progress-bar::after {
            content: '';

            right: -7px;
            top: 50%;

            height: 14px;
            border-radius: 50%;

        #np-progress-wrap:hover #np-progress-bar::after,

        .np-progress-panel { display: none; }

            /* Bottom bar absolutely pinned to bottom */
            .np-bottom-bar {
                position: absolute;
                bottom: 0; left: 0; right: 0;
                padding: 8px 16px 12px;
                background: var(--surface);
            }
            .np-controls-row { margin-bottom: 8px; }
            .np-share-btn { margin-top: 0; width: 100%; }
            /* Show prev + active + next1 only on mobile */
            /* teleprompter: all lines rendered in scroll container */
        }


        @media (max-width: 840px) {
            header {
                min-height: 126px;
                padding: 18px 18px;
            }
            .masthead-text .lens-heading { font-size: clamp(2rem, 9vw, 3rem); }
            .wolf-logo { width: 62px; height: 62px; }
            .lens-room-top { grid-template-columns: 1fr; }
            .lens-room-controls { justify-content: flex-start; }
        }

        @media (max-width: 640px) {
            header {
                min-height: auto;
                padding: 24px 18px 22px;
                align-items: flex-start;
            }
            .masthead-text { padding-left: 16px; }
            .masthead-text .lens-heading { font-size: clamp(2.45rem, 12vw, 3.5rem); }
            .masthead-text .lens-copy { font-size: 0.82rem; max-width: 100%; }
            .wolf-logo { width: 58px; height: 58px; margin-top: 4px; }
            .lens-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .lens-card { min-height: 96px; padding: 12px; }
            .lens-card-title { font-size: 1.08rem; }
            .lens-card-desc { font-size: 0.63rem; }
            .lens-actions { justify-content: stretch; }
            .lens-actions .action-pill { flex: 1; justify-content: center; }
        }

        /* ── Keyboard shortcut toast ── */
        .kbd-toast {
            position: fixed;
            bottom: calc(var(--player-h) + 14px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.74rem;
            padding: 5px 14px;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s, transform 0.18s;
            z-index: 300;
            white-space: nowrap;
        }
        .kbd-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <div class="masthead-text">
            <div class="lens-kicker">Generify presents</div>
            <div class="lens-heading">Emotional Lenses</div>
            <p class="lens-copy">Every song begins as a moment — a memory, a feeling, a small piece of life. Explore the library through the lens that fits where you are tonight.</p>
        </div>

             onerror="this.style.display='none'">

    <main>
        <div class="lens-gallery" id="filter-bar"></div>
        <div class="lens-actions" id="lens-actions"></div>
        <div id="main-content">

    <!-- ── Now Playing Modal ── -->
    <div class="now-playing-overlay" id="np-overlay" onclick="handleOverlayClick(event)">
        <div class="now-playing-card" id="np-card">
            <!-- Cover section -->

                <img class="np-cover" id="np-cover" src="" alt="">
                <div class="np-cover-placeholder" id="np-cover-ph">♪</div>
                <div class="np-gradient"></div>
                <div class="np-swipe-hint left">‹</div>
                <div class="np-swipe-hint right">›</div>
                <div class="np-track-artist-row">
                    <div class="np-track"><span class="np-track-inner" id="np-track-inner">—</span></div>
                    <div class="np-artist" id="np-artist">—</div>
                </div>
                <div class="np-progress-wrap" id="np-progress-wrap">
                    <div class="np-progress-bar" id="np-progress-bar"></div>
                </div>
            </div>
            <!-- Lyrics + controls panel -->
            <div class="np-content">
                <div class="np-top-group">
                    <div class="np-time">
                        <span id="np-current">0:00</span>
                        <span id="np-duration">0:00</span>
                    </div>
                    <!-- Progress bar shown in content panel on landscape -->

                            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
                            <polyline points="16 6 12 2 8 6"/>
                            <line x1="12" y1="2" x2="12" y2="15"/>

    <div class="player-bar" id="player-bar">
        <!-- Seekable progress strip -->
        <div class="player-seek-wrap" id="player-seek-wrap">
            <div class="player-seek-track">
                <div class="player-seek-fill" id="player-seek-fill"></div>
            </div>
        </div>
        <div class="player-info">
            <img id="player-thumb" class="player-thumb" src="" alt="">
            <div class="player-thumb-placeholder" id="player-thumb-ph">♪</div>

                <div class="player-track">
                    <span class="player-track-inner" id="player-track-inner">—</span>
                </div>
                <div id="player-artist" class="player-artist">—</div>

            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="prev-btn" title="Previous (←)" aria-label="Previous track" data-icon="previous"></button>
            <button class="ctrl-btn primary" id="play-btn" title="Play / Pause (Space)" aria-label="Play"></button>
            <button class="ctrl-btn" id="next-btn" title="Next (→)" aria-label="Next track" data-icon="next"></button>

    <div class="kbd-toast" id="kbd-toast"></div>

    <!-- Share toast -->
    <div class="share-toast" id="share-toast">Link copied to clipboard</div>

    <script>
        // ── localStorage keys ─────────────────────────────────
        // Clear last played on fresh load — always start fresh
        try { localStorage.removeItem('gm_last'); } catch(_) {}
        const LS_LAST  = 'gm_last';   // { albumId, trackIndex, currentTime, lens }
        const LS_CACHE = 'gm_albums'; // full album array cache

        // ── Queue ─────────────────────────────────────────────
        let queue      = [];
        let queuePos   = 0;
        let isShuffled = false;

        let currentAlbum  = null;
        let currentTracks = [];
        let currentIndex  = 0;
        let activeCard    = null;

        const LENS_DEFAULTS = [
            'Quiet House', 'Bittersweet', 'Campfire', 'A Night Out',
            'Rainy Window', 'Healing', 'Road Trip', 'Dreamscape',
            'Late Night', 'Funny Bone', 'Soft Sleep', 'Reflection',
            'Human Connections'
        ];

        const LENS_DESCRIPTIONS = {
            'All': 'The full room of songs, moments, and memories.',
            'Quiet House': 'Still rooms, warm lamps, memory, and tenderness.',
            'Bittersweet': 'Beauty with a bruise; joy and ache together.',
            'Campfire': 'Stories, pub warmth, shared laughter, and embers.',
            'A Night Out': 'Neon, movement, mischief, and the long ride home.',
            'Rainy Window': 'Weathered glass, late thoughts, and soft melancholy.',
            'Healing': 'Gentle repair, acceptance, and emotional shelter.',
            'Road Trip': 'Forward motion, open roads, and private horizons.',
            'Dreamscape': 'Fog, stars, drift, and the unreal edge of memory.',
            'Late Night': 'Low light, solitude, and after-midnight honesty.',
