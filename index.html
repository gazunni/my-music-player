            'Soft Sleep': 'Rest, lullaby, quiet breathing, and release.',
            'Reflection': 'Looking back without losing the warmth of now.',
            'Human Connections': 'Friendship, family, loyalty, and shared moments.',
            'Unlensed': 'Tracks still waiting for their emotional home.',
            'New Pulse': 'Physics is Wrong. New Energy is Created Here.'
        };

        const LENS_ART = {
            'All': 'radial-gradient(circle at 20% 20%, rgba(232,0,15,0.38), transparent 28%), radial-gradient(circle at 80% 70%, rgba(255,190,120,0.16), transparent 35%)',
            'Quiet House': 'radial-gradient(circle at 20% 20%, rgba(255,176,92,0.34), transparent 30%), linear-gradient(135deg, rgba(50,28,18,0.84), rgba(8,10,12,0.92))',
            'Bittersweet': 'radial-gradient(circle at 25% 25%, rgba(232,0,15,0.32), transparent 32%), radial-gradient(circle at 75% 80%, rgba(120,88,255,0.18), transparent 38%)',
            'Campfire': 'radial-gradient(circle at 35% 82%, rgba(255,104,22,0.56), transparent 26%), linear-gradient(135deg, rgba(52,22,8,0.82), rgba(5,6,7,0.96))',
            'A Night Out': 'radial-gradient(circle at 18% 20%, rgba(232,0,15,0.42), transparent 30%), radial-gradient(circle at 85% 75%, rgba(36,126,255,0.28), transparent 35%)',
            'Rainy Window': 'linear-gradient(135deg, rgba(32,44,58,0.9), rgba(8,10,12,0.94)), radial-gradient(circle at 70% 20%, rgba(160,190,220,0.18), transparent 36%)',
            'Healing': 'radial-gradient(circle at 20% 30%, rgba(130,214,170,0.28), transparent 34%), linear-gradient(135deg, rgba(18,44,34,0.78), rgba(8,10,12,0.96))',
            'Road Trip': 'linear-gradient(135deg, rgba(60,35,20,0.86), rgba(8,10,12,0.94)), radial-gradient(circle at 80% 25%, rgba(255,212,114,0.24), transparent 30%)',
            'Dreamscape': 'radial-gradient(circle at 30% 20%, rgba(162,120,255,0.34), transparent 30%), radial-gradient(circle at 78% 78%, rgba(70,160,255,0.2), transparent 36%)',
            'Late Night': 'radial-gradient(circle at 75% 18%, rgba(80,110,255,0.28), transparent 30%), linear-gradient(135deg, rgba(8,12,28,0.96), rgba(3,4,8,0.98))',
            'Funny Bone': 'radial-gradient(circle at 22% 26%, rgba(255,201,75,0.36), transparent 30%), radial-gradient(circle at 82% 74%, rgba(232,0,15,0.25), transparent 38%)',
            'Soft Sleep': 'radial-gradient(circle at 50% 20%, rgba(210,210,255,0.22), transparent 36%), linear-gradient(135deg, rgba(18,18,34,0.92), rgba(6,7,12,0.98))',
            'Reflection': 'radial-gradient(circle at 22% 78%, rgba(180,190,205,0.22), transparent 34%), linear-gradient(135deg, rgba(28,31,36,0.94), rgba(7,8,10,0.98))',
            'Human Connections': 'radial-gradient(circle at 26% 30%, rgba(255,148,112,0.32), transparent 32%), radial-gradient(circle at 80% 78%, rgba(255,215,140,0.18), transparent 38%)',
            'Unlensed': 'linear-gradient(135deg, rgba(40,40,44,0.88), rgba(8,10,12,0.96))',
            'New Pulse': 'radial-gradient(circle at 28% 40%, rgba(34,197,94,0.38), transparent 32%), radial-gradient(circle at 75% 25%, rgba(255,190,60,0.28), transparent 36%)'
        };

        const LENS_IMAGE = {
            'Quiet House': "url('/assets/lenses/quiet-house/hero.webp')",
            'Bittersweet': "url('/assets/lenses/bittersweet/hero.webp')",
            'Campfire': "url('/assets/lenses/campfire/hero.webp')",
            'Rainy Window': "url('/assets/lenses/rainy-window/hero.webp')",
            'Healing': "url('/assets/lenses/healing/hero.webp')",
            'Road Trip': "url('/assets/lenses/road-trip/hero.webp')",
            'Dreamscape': "url('/assets/lenses/dreamscape/hero.webp')",
            'Late Night': "url('/assets/lenses/late-night/hero.webp')",
            'A Night Out': "url('/assets/lenses/a-night-out/hero.webp')",
            'Funny Bone': "url('/assets/lenses/funny-bone/hero.webp')",
            'Soft Sleep': "url('/assets/lenses/soft-sleep/hero.webp')",
            'Reflection': "url('/assets/lenses/reflection/hero.webp')",
            'Human Connections': "url('/assets/lenses/human-connections/hero.webp')",
            'New Pulse': "url('/assets/lenses/new-pulse/hero.webp')"
        };

        const FULL_LIBRARY = 'Library View';

        function normLens(value) { return (value || '').trim(); }
        function trackPrimaryLens(track) { return normLens(track.primaryLens || track.lens || ''); }
        const NEW_PULSE = 'New Pulse';

        function getNewPulseTracks(albums) {
            // Get tracks from the 3 albums with highest IDs, newest first
            const sorted = [...albums].sort((a, b) => b.id - a.id).slice(0, 3);
            return flattenTracks(sorted);
        }

        function lensMatches(track, lens, album, albums) {
            if (!lens) return false;
            if (lens === FULL_LIBRARY) return true;
            if (lens === NEW_PULSE) {
                if (!albums) return false;
                const sorted = [...albums].sort((a, b) => b.id - a.id).slice(0, 3);
                const ids = new Set(sorted.map(a => a.id));
                return ids.has(album ? album.id : -1);
            }
            const primary = trackPrimaryLens(track);
            return primary === lens;
        }
        function flattenTracks(albums) {
            const entries = [];
            albums.forEach(album => {
                (album.tracks || []).forEach((track, i) => entries.push({ album, track, trackIndex: i }));
            });
            return entries;
        }
        function getActiveEntries() {
            return flattenTracks(allAlbums).filter(({ track, album }) => lensMatches(track, activeLens, album, allAlbums));
        }
        function getLensList(albums) {
            const found = new Set();
            flattenTracks(albums).forEach(({ track }) => {
                const primary = trackPrimaryLens(track);
                if (primary) found.add(primary);
            });
            const list = LENS_DEFAULTS.filter(lens => lens === NEW_PULSE || found.has(lens)).concat(
                Array.from(found).filter(lens => !LENS_DEFAULTS.includes(lens)).sort()
            );
            // Ensure New Pulse appears first if library has albums
            if (albums.length > 0 && !list.includes(NEW_PULSE)) {
                list.unshift(NEW_PULSE);
            }
            return list;
        }

        function buildQueue(entries, shuffle = false) {
            queue = entries.slice();
            if (shuffle) {
                for (let i = queue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [queue[i], queue[j]] = [queue[j], queue[i]];
                }
            }
            queuePos   = 0;
            isShuffled = shuffle;
        }

        function playQueue(entries, shuffle = false) {
            if (!entries.length) return;
            buildQueue(entries, shuffle);
            playQueueItem(0);
        }

        function playQueueItem(pos) {
            if (pos < 0 || pos >= queue.length) return;
            queuePos = pos;
            const { album, track, trackIndex } = queue[pos];

            if (activeCard) { activeCard.classList.remove('active'); updateCardOverlay(activeCard, false); }
            const newCard = document.querySelector(`.album-card[data-album-id="${album.id}"][data-track-index="${trackIndex}"]`);
            if (newCard) { newCard.classList.add('active'); activeCard = newCard; }

            currentAlbum  = album;
            currentTracks = album.tracks;
            currentIndex  = trackIndex;

            updateBarMeta(track, album);
            audio.src = track.url;
            openNowPlaying(track, album);
            audio.play()
                .then(() => {
                    setPlayState(true);
                    playerBar.classList.add('visible');
                    saveLastPlayed();
                    updateUpNext();
                })
                .catch(err => { console.error(err); showPlayError(); });
        }

        function playAll()    { requestImmersiveFullscreen(); playQueue(getActiveEntries(), false); }
        function shuffleAll() { requestImmersiveFullscreen(); playQueue(getActiveEntries(), true);  }

        // Shuffle across every track in every lens, ignoring lens filtering
        // entirely — accessible from the landing gallery, next to Library View,
        // so the lens-first premise of the app stays intact.
        function shuffleEntireLibrary() {
            requestImmersiveFullscreen();
            playQueue(flattenTracks(allAlbums), true);
        }

        // ── DOM refs ──────────────────────────────────────────
        const mainEl         = document.getElementById('main-content');
        const playerBar      = document.getElementById('player-bar');
        const audio          = document.getElementById('audio-player');
        const playBtn        = document.getElementById('play-btn');
        const prevBtn        = document.getElementById('prev-btn');
        const nextBtn        = document.getElementById('next-btn');
        const artistEl       = document.getElementById('player-artist');
        const thumbEl        = document.getElementById('player-thumb');
        const thumbPh        = document.getElementById('player-thumb-ph');
        const npPlayBtn      = document.getElementById('np-play-btn');

        const ICONS = {
            play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .78.86 1.25 1.52.82l10.36-6.8a.98.98 0 0 0 0-1.64L9.52 4.38C8.86 3.95 8 4.42 8 5.2Z"/></svg>',
            pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.3 4.5h3.1c.58 0 1.05.47 1.05 1.05v12.9c0 .58-.47 1.05-1.05 1.05H7.3c-.58 0-1.05-.47-1.05-1.05V5.55c0-.58.47-1.05 1.05-1.05Zm6.3 0h3.1c.58 0 1.05.47 1.05 1.05v12.9c0 .58-.47 1.05-1.05 1.05h-3.1c-.58 0-1.05-.47-1.05-1.05V5.55c0-.58.47-1.05 1.05-1.05Z"/></svg>',
            previous: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.15c.5 0 .9.4.9.9v11.9c0 .5-.4.9-.9.9s-.9-.4-.9-.9V6.05c0-.5.4-.9.9-.9Zm13.45.62v12.46c0 .76-.84 1.21-1.47.8L8.25 13v5.23c0 .76-.84 1.21-1.47.8l-.38-.25V5.22l.38-.25c.63-.41 1.47.04 1.47.8V11l9.23-6.03c.63-.41 1.47.04 1.47.8Z"/></svg>',
            next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 5.15c-.5 0-.9.4-.9.9v11.9c0 .5.4.9.9.9s.9-.4.9-.9V6.05c0-.5-.4-.9-.9-.9ZM5.05 5.77v12.46c0 .76.84 1.21 1.47.8L15.75 13v5.23c0 .76.84 1.21 1.47.8l.38-.25V5.22l-.38-.25c-.63-.41-1.47.04-1.47.8V11L6.52 4.97c-.63-.41-1.47.04-1.47.8Z"/></svg>'
        };

        function setButtonIcon(button, name, label) {
            if (!button || !ICONS[name]) return;
            button.innerHTML = ICONS[name];
            if (label) button.setAttribute('aria-label', label);
        }

        function initialiseTransportIcons() {
            document.querySelectorAll('[data-icon="previous"]').forEach((btn) => setButtonIcon(btn, 'previous', 'Previous track'));
            document.querySelectorAll('[data-icon="next"]').forEach((btn) => setButtonIcon(btn, 'next', 'Next track'));
            setButtonIcon(playBtn, 'play', 'Play');
            setButtonIcon(npPlayBtn, 'play', 'Play');
        }
        const trackInnerEl   = document.getElementById('player-track-inner');
        const upNextEl       = document.getElementById('player-up-next');
        const seekFill       = document.getElementById('player-seek-fill');

        let allAlbums   = [];
        let activeLens = null;

        // ── Load albums with localStorage fallback ────────────
        async function loadAlbums() {
            let ok = false;
            try {
                const res = await fetch('/api/albums');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allAlbums = await res.json();
                try { localStorage.setItem(LS_CACHE, JSON.stringify(allAlbums)); } catch(_) {}
                ok = true;
            } catch (err) {
                try {
                    const cached = localStorage.getItem(LS_CACHE);
                    if (cached) {
                        allAlbums = JSON.parse(cached);
                        ok = true;
                        // Show a subtle offline notice without nuking the whole UI
                        const notice = document.createElement('p');
                        notice.className = 'state-msg';
                        notice.style.cssText = 'color:rgba(232,0,15,0.7);font-size:0.76rem;padding:8px 0 0';
                        notice.textContent = 'Offline — showing cached library';
                        mainEl.prepend(notice);
                    }
                } catch(_) {}
                if (!ok) {
                    mainEl.innerHTML = `<p class="state-msg">Could not load albums. ${err.message}</p>`;
                    return;
                }
            }
            buildFilterBar(allAlbums);
            renderLensRows(allAlbums, activeLens);
            if (pendingPlay) {
                checkAutoPlay();
            } else {
                // restoreLastPlayed(); — disabled: start fresh on every page load
            }
        }

        // ── Persist / restore last played ────────────────────
        function saveLastPlayed() {
            if (!currentAlbum) return;
            try {
                localStorage.setItem(LS_LAST, JSON.stringify({
                    albumId:     currentAlbum.id,
                    trackIndex:  currentIndex,
                    currentTime: audio.currentTime,
                    lens:        activeLens
                }));
            } catch(_) {}
        }

        function restoreLastPlayed() {
            try {
                const raw = localStorage.getItem(LS_LAST);
                if (!raw) return;
                const { albumId, trackIndex, currentTime, lens, genre } = JSON.parse(raw);
                const album = allAlbums.find(a => a.id === albumId);
                if (!album) return;

                // Restore state — paused, so user resumes intentionally.
                // Do not auto-enter an Emotional Lens on landing; the user chooses the room.

                currentAlbum  = album;
                currentTracks = album.tracks;
                currentIndex  = trackIndex || 0;
                const track   = currentTracks[currentIndex];
                if (!track) return;

                updateBarMeta(track, album);
                audio.src         = track.url;
                audio.currentTime = currentTime || 0;
                playerBar.classList.add('visible');

                // Highlight the last card
                if (activeCard) activeCard.classList.remove('active');
                const card = document.querySelector(`.album-card[data-album-id="${album.id}"][data-track-index="${currentIndex}"]`);
                if (card) { card.classList.add('active'); activeCard = card; }

                updateUpNext();
            } catch(_) {}
        }

        // ── Emotional Lens navigation ─────────────────────────
        function buildFilterBar(albums) {
            const bar = document.getElementById('filter-bar');
            const actionsMount = document.getElementById('lens-actions');
            const lenses = getLensList(albums);
            const counts = {};
            lenses.forEach(l => counts[l] = 0);
            flattenTracks(albums).forEach(({ track, album }) => {
                const primary = trackPrimaryLens(track);
                if (primary && counts[primary] !== undefined) counts[primary] += 1;
            });
            // New Pulse always shows 3 (or fewer if library has < 3 albums)
            if (counts['New Pulse'] !== undefined) {
                counts['New Pulse'] = Math.min(3, albums.length);
            }

            bar.innerHTML = '';
            bar.classList.toggle('room-mode', !!activeLens);

            if (activeLens === FULL_LIBRARY) {
                const badge = document.createElement('div');
                badge.className = 'lens-room-top';
                badge.innerHTML = `
                    <div class="lens-room-badge">
                        <div class="lens-room-label">Viewing</div>
                        <div class="lens-room-title">Library View</div>
                    </div>
                    <div class="lens-room-controls">
                        <button class="action-pill lens-door" type="button" onclick="returnToLensGallery()">← Back to Emotional Lenses</button>
                    </div>
                `;
                bar.appendChild(badge);
            } else if (activeLens) {
                const badge = document.createElement('div');
                badge.className = 'lens-room-top';
                badge.innerHTML = `
                    <div class="lens-room-badge" style="--lens-image:${LENS_IMAGE[activeLens] || 'none'}; --lens-art:${LENS_ART[activeLens] || LENS_ART.All};">
                        <div class="lens-room-label">Viewing through</div>
                        <div class="lens-room-title">${escapeHTML(activeLens)}</div>
                    </div>
                    <div class="lens-room-controls">
                        <button class="action-pill lens-door" type="button" onclick="returnToLensGallery()">← Back</button>
                        <button class="action-pill" id="play-all-btn" onclick="playAll()">▶ Play</button>
                        <button class="action-pill" id="shuffle-btn" onclick="shuffleAll()">⇄ Shuffle</button>
                        <button class="action-pill lens-door" onclick="enterFullLibrary()">Library View</button>
                    </div>
                `;
                bar.appendChild(badge);
            } else {
                lenses.forEach(lens => {
                    const card = document.createElement('button');
                    card.type = 'button';
                    card.className = 'lens-card';
                    card.style.setProperty('--lens-art', LENS_ART[lens] || LENS_ART.All);
                    card.style.setProperty('--lens-image', LENS_IMAGE[lens] || 'none');
                    card.innerHTML = `
                        <div class="lens-card-title">${escapeHTML(lens)}</div>
                        <div class="lens-card-desc">${escapeHTML(LENS_DESCRIPTIONS[lens] || 'A curated emotional room.')}</div>
                        <span class="lens-card-count">${counts[lens] || 0} track${(counts[lens] || 0) === 1 ? '' : 's'}</span>
                    `;
                    card.onclick = () => enterLens(lens);
                    bar.appendChild(card);
                });
            }

            if (activeLens && activeLens !== FULL_LIBRARY) {
                actionsMount.innerHTML = '';
            } else if (activeLens === FULL_LIBRARY) {
                // Back button now lives in the persistent top badge above instead.
                actionsMount.innerHTML = '';
            } else {
                actionsMount.innerHTML = `
                    <button class="action-pill" onclick="shuffleEntireLibrary()">⇄ Shuffle All</button>
                    <button class="action-pill lens-door" onclick="enterFullLibrary()">Library View</button>
                `;
            }
            updateLensActionLabels();
        }

        function requestImmersiveFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            }
        }

        function scrollToRoomStart() {
            // Match returnToLensGallery()'s approach — an absolute scroll to the
            // page top is reliable in both directions. The previous getBoundingClientRect
            // calculation broke once the badge became position:sticky: if the page
            // was already scrolled down when a room was entered, the badge could
            // already read as "stuck" at top:0 the instant its class changed,
            // making the computed offset ~0 and skipping the scroll entirely.
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function enterLens(lens) {
            requestImmersiveFullscreen();
            activeLens = lens;
            buildFilterBar(allAlbums);
            renderLensRows(allAlbums, activeLens);
            updateLensActionLabels();
            scrollToRoomStart();
        }

        function enterFullLibrary() {
            requestImmersiveFullscreen();
            activeLens = FULL_LIBRARY;
            buildFilterBar(allAlbums);
            renderLensRows(allAlbums, activeLens);
            updateLensActionLabels();
            scrollToRoomStart();
        }

        function returnToLensGallery() {
            activeLens = null;
            buildFilterBar(allAlbums);
            renderLensRows(allAlbums, activeLens);
            updateLensActionLabels();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateLensActionLabels() {
            const playAllBtn = document.getElementById('play-all-btn');
            const shuffleBtn = document.getElementById('shuffle-btn');
            if (playAllBtn) playAllBtn.innerHTML = `▶ ${activeLens === FULL_LIBRARY ? 'Play Library' : `Play ${activeLens || ''}`}`;
            if (shuffleBtn) shuffleBtn.innerHTML = `⇄ ${activeLens === FULL_LIBRARY ? 'Shuffle Library' : `Shuffle ${activeLens || ''}`}`;
        }

        // ── Render lens rows ──────────────────────────────────
        function renderLensRows(albums, lensFilter) {
            if (!albums.length) {
                mainEl.innerHTML = '<p class="state-msg">No albums found.</p>';
                return;
            }

            if (!lensFilter) {
                mainEl.innerHTML = '<div class="lens-landing-prompt">Choose an Emotional Lens to enter the room, or use <strong>Library View</strong> if you prefer the plain catalogue door.</div>';
                return;
            }

            const entries = lensFilter === NEW_PULSE
                ? getNewPulseTracks(albums)
                : flattenTracks(albums).filter(({ track, album }) => lensMatches(track, lensFilter, album, albums));
            if (!entries.length) {
                mainEl.innerHTML = '<p class="state-msg">No tracks found for this lens yet.</p>';
                return;
            }

            const groups = {};
            entries.forEach(entry => {
                const lens = trackPrimaryLens(entry.track) || 'Unlensed';
                const groupName = lensFilter === FULL_LIBRARY ? lens : lensFilter;
                if (!groups[groupName]) groups[groupName] = [];
                groups[groupName].push(entry);
            });

            mainEl.innerHTML = '';

            const orderedNames = lensFilter === FULL_LIBRARY
                ? getLensList(albums).filter(l => groups[l])
                : [lensFilter];

            orderedNames.forEach(lens => {
                const lensEntries = groups[lens] || [];
                if (!lensEntries.length) return;

                const section  = document.createElement('section');
                section.className = 'genre-section lens-section';
                const lensKey = lens.replace(/[^a-z0-9]/gi, '_');
                section.innerHTML = `
                    <div class="genre-header">
                        <span class="genre-title">${escapeHTML(lens)}</span>
                        <span class="genre-count">${lensEntries.length} track${lensEntries.length !== 1 ? 's' : ''}</span>
                        <div class="genre-rule"></div>
                    </div>
                    <div class="album-row" id="lens-row-${lensKey}"></div>
                `;

                const row = section.querySelector('.album-row');

                lensEntries.forEach((entry, idx) => {
                    const { album, track, trackIndex } = entry;
                    const card = document.createElement('div');
                    card.className = 'album-card';
                    card.dataset.albumId = album.id;
                    card.dataset.trackIndex = trackIndex;
                    card.style.animationDelay = `${idx * 35}ms`;

                    const safeTitle  = escapeAttr(track.title || album.title || 'Untitled');
                    const safeArtist = escapeHTML(album.artist || '');
                    const safeCover  = escapeAttr(album.cover || '');
                    const safeAlbum  = escapeHTML(album.title || '');
                    const primary    = trackPrimaryLens(track) || 'Unlensed';
                    const durLabel   = track.duration ? formatTime(track.duration) : '';

                    card.innerHTML = `
                        <div class="album-cover-wrap" id="cwrap-${album.id}-${trackIndex}">
                            <img class="album-cover" src="${safeCover}" alt="${safeTitle}"
                                 onerror="coverError(this,'${album.id}-${trackIndex}')">
                            <div class="play-overlay" data-overlay>
                                <svg viewBox="0 0 48 48" fill="none">
                                    <circle cx="24" cy="24" r="23" stroke="white" stroke-width="1.5" opacity="0.6"/>
                                    <path class="play-path" d="M19 16l14 8-14 8V16z" fill="white"/>
                                    <g class="pause-bars" style="display:none">
                                        <rect x="16" y="14" width="5" height="20" rx="1.5" fill="white"/>
                                        <rect x="27" y="14" width="5" height="20" rx="1.5" fill="white"/>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="album-info">
                            <div class="album-title">
                                <span class="album-title-inner">${safeTitle}</span>
                            </div>
                            <div class="album-artist">${safeArtist}</div>
                            ${safeAlbum ? `<div class="album-duration">${safeAlbum}</div>` : ''}
                            <span class="track-lens">${escapeHTML(primary)}</span>
                            ${durLabel ? `<div class="album-duration">${durLabel}</div>` : ''}
                        </div>
                    `;

                    requestAnimationFrame(() => {
                        const inner = card.querySelector('.album-title-inner');
                        const outer = card.querySelector('.album-title');
                        if (inner && outer && inner.scrollWidth > outer.clientWidth + 2) {
                            inner.style.setProperty('--marquee-offset', `-${inner.scrollWidth - outer.clientWidth}px`);
                            inner.classList.add('overflows');
                        }
                    });

                    card.onclick = () => {
                        const same = currentAlbum && currentAlbum.id === album.id && currentIndex === trackIndex;
                        if (same) {
                            if (audio.paused) {
                                audio.play();
                                setPlayState(true);
                                openNowPlaying(track, currentAlbum);
                            } else {
                                audio.pause();
                                setPlayState(false);
                            }
                        } else {
                            // Build a sequential queue from this lens row so Next/Prev can
                            // walk through it — matches playAll's ordering, just not shuffled.
                            // (Shuffle stays a separate, explicit action via shuffleAll().)
                            buildQueue(lensEntries, false);
                            playQueueItem(idx);
                        }
                    };

                    row.appendChild(card);
                });

                mainEl.appendChild(section);
            });

            if (currentAlbum) {
                const card = document.querySelector(`.album-card[data-album-id="${currentAlbum.id}"][data-track-index="${currentIndex}"]`);
                if (card) { card.classList.add('active'); activeCard = card; }
            }
        }

        function escapeHTML(value) {
            return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        function escapeAttr(value) {
            return escapeHTML(value).replace(/"/g,'&quot;');
        }

        // ── Cover error → music note placeholder ─────────────
        function coverError(img, albumId) {
            img.style.display = 'none';
            const wrap = document.getElementById('cwrap-' + albumId);
            if (wrap) wrap.classList.add('no-cover');
        }

        // ── Update bar metadata ───────────────────────────────
        function updateBarMeta(track, album) {
            trackInnerEl.textContent = track.title;
            trackInnerEl.classList.remove('overflows');
            artistEl.textContent = album.artist;

            // Thumb — handle missing cover
            thumbEl.style.display = 'block';
            thumbPh.classList.remove('visible');
            thumbEl.onerror = () => {
                thumbEl.style.display = 'none';
                thumbPh.classList.add('visible');
            };
            thumbEl.src = album.cover;

            updateMediaSessionMetadata(track, album);

            // Marquee on bar title after paint
            requestAnimationFrame(() => {
                const outer = trackInnerEl.parentElement;
                if (trackInnerEl.scrollWidth > outer.clientWidth + 2) {
                    trackInnerEl.style.setProperty('--marquee-offset', `-${trackInnerEl.scrollWidth - outer.clientWidth}px`);
                    trackInnerEl.classList.add('overflows');
                }
            });
        }

        // ── Media Session — lock-screen / Bluetooth / hardware controls ──
        function coverMimeType(coverUrl) {
            const ext = (coverUrl || '').split('?')[0].split('.').pop().toLowerCase();
            return { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif' }[ext] || 'image/jpeg';
        }

        function updateMediaSessionMetadata(track, album) {
            if (!('mediaSession' in navigator)) return;
            const coverUrl = album.cover ? new URL(album.cover, location.href).href : '';
            navigator.mediaSession.metadata = new MediaMetadata({
                title: track.title,
                artist: album.artist,
                album: album.title,
                artwork: coverUrl ? [{ src: coverUrl, sizes: '512x512', type: coverMimeType(coverUrl) }] : []
            });
        }

        function initMediaSessionHandlers() {
            if (!('mediaSession' in navigator)) return;
            navigator.mediaSession.setActionHandler('play', () => { audio.play(); setPlayState(true); });
            navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); setPlayState(false); });
            navigator.mediaSession.setActionHandler('previoustrack', skipPrev);
            navigator.mediaSession.setActionHandler('nexttrack', skipNext);
            try {
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.fastSeek && 'fastSeek' in audio) { audio.fastSeek(details.seekTime); return; }
                    audio.currentTime = details.seekTime;
                });
                navigator.mediaSession.setActionHandler('seekbackward', (details) => {
                    audio.currentTime = Math.max(0, audio.currentTime - (details.seekOffset || 10));
                });
                navigator.mediaSession.setActionHandler('seekforward', (details) => {
                    audio.currentTime = Math.min(audio.duration || Infinity, audio.currentTime + (details.seekOffset || 10));
                });
            } catch (e) { /* seek handlers are optional — not all browsers support them */ }
        }

        // ── Up Next ───────────────────────────────────────────
        function updateUpNext() {
            let next = null;
            if (queue.length > 0 && queuePos < queue.length - 1) {
                next = queue[queuePos + 1].track.title;
            } else if (currentAlbum && currentIndex < currentTracks.length - 1) {
                next = currentTracks[currentIndex + 1].title;
            }
            if (next) {
                upNextEl.innerHTML = `<em>Up next:</em> ${next.replace(/</g,'&lt;')}`;
                upNextEl.style.display = 'block';
            } else {
                upNextEl.style.display = 'none';
            }
        }

        // ── loadAndPlay ───────────────────────────────────────
        function loadAndPlay(album) {
            queue = []; queuePos = 0;
            currentAlbum  = album;
            currentTracks = album.tracks;
            currentIndex  = 0;
            playTrack(0);
        }

        function updateCardOverlay(card, playing) {
            if (!card) return;
            const pp = card.querySelector('.play-path');
            const pb = card.querySelector('.pause-bars');
            if (!pp || !pb) return;
            pp.style.display = playing ? 'none' : '';
            pb.style.display = playing ? '' : 'none';
        }

        // ── Unified play-state setter ─────────────────────────
        function setPlayState(playing) {
            setButtonIcon(playBtn, playing ? 'pause' : 'play', playing ? 'Pause' : 'Play');
            setButtonIcon(npPlayBtn, playing ? 'pause' : 'play', playing ? 'Pause' : 'Play');
            updateCardOverlay(activeCard, playing);
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
            }
        }

        // ── Now Playing Modal ─────────────────────────────────
        let npOpen = false;
        let savedScrollY = 0;

        async function openNowPlaying(track, album) {
            const overlay  = document.getElementById('np-overlay');
            const coverEl  = document.getElementById('np-cover');
            const coverPh  = document.getElementById('np-cover-ph');
            const tInner   = document.getElementById('np-track-inner');

            // Clear lyrics immediately
            lrcLines = []; lrcCurrent = -1;
            renderLyrics([]);

            // Reset cover
            coverEl.style.display = 'block';
            coverEl.src = '';
            coverPh.classList.remove('visible');

            tInner.textContent = track.title;
            tInner.classList.remove('overflows');
            document.getElementById('np-artist').textContent = album.artist;
            setButtonIcon(npPlayBtn, audio.paused ? 'play' : 'pause', audio.paused ? 'Play' : 'Pause');

            overlay.classList.add('open');
            if (!npOpen) {
                // Only capture/lock scroll on the initial open — if the modal is
                // already open (e.g. skipping to the next track), body is already
                // fixed and window.scrollY would read stale/zero.
                savedScrollY = window.scrollY || window.pageYOffset || 0;
                document.body.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.top = `-${savedScrollY}px`;
                document.body.style.width = '100%';
                document.body.classList.add('modal-open');
            }
            npOpen = true;

            coverEl.onload  = () => {
                coverPh.classList.remove('visible');
                // Marquee on modal title after cover sets dimensions
                requestAnimationFrame(() => {
                    const outer = tInner.parentElement;
                    if (tInner.scrollWidth > outer.clientWidth + 2) {
                        tInner.style.setProperty('--marquee-offset', `-${tInner.scrollWidth - outer.clientWidth}px`);
                        tInner.classList.add('overflows');
                    }
                });
            };
            coverEl.onerror = () => {
                coverEl.style.display = 'none';
                coverPh.classList.add('visible');
            };
            coverEl.src = album.cover;

            if (track.lrc) {
                try {
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 5000);
                    const res = await fetch(track.lrc, { signal: controller.signal });
                    clearTimeout(timer);
                    if (res.ok) {
                        const text = await res.text();
                        lrcLines = parseLRC(text);
                        renderLyrics(lrcLines);
                        updateLyrics(audio.currentTime);
                    }
                } catch (e) { console.warn('Could not load lyrics:', e); }
            }
        }

        function closeNowPlaying() {
            document.getElementById('np-overlay').classList.remove('open');
            npOpen = false;
            document.body.style.overflow = '';
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.width = '';
            document.body.classList.remove('modal-open');
            window.scrollTo(0, savedScrollY);
            // Full lyrics reset so reopening starts fresh
            lrcLines = [];
            lrcCurrent = -1;
            lineEls = [];
            lineHeight = 0;
            const scroll = document.getElementById('np-lyrics-scroll');
            if (scroll) { scroll.innerHTML = ''; scroll.style.transform = 'translateY(0)'; }
            const win = document.getElementById('np-lyrics-window');
            if (win) win.classList.remove('visible');
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('np-overlay')) closeNowPlaying();
        }

        function togglePlay() {
            if (audio.paused) { audio.play(); setPlayState(true); }
            else              { audio.pause(); setPlayState(false); }
        }

        // ── Skip logic ────────────────────────────────────────
        function skipNext() {
            if (queue.length > 0) {
                if (queuePos < queue.length - 1) {
                    playQueueItem(queuePos + 1);
                }
                // At end of queue — do nothing (song already ended naturally)
            } else if (currentAlbum && currentIndex < currentTracks.length - 1) {
                currentIndex++; playTrack(currentIndex);
            }
            // Single track, no queue — next does nothing
        }

        function skipPrev() {
            if (audio.currentTime > 3) { audio.currentTime = 0; return; }
            if (queue.length > 0 && queuePos > 0) {
                playQueueItem(queuePos - 1);
            } else if (currentAlbum && currentIndex > 0) {
                currentIndex--; playTrack(currentIndex);
            } else {
                // Beginning — restart song
                audio.currentTime = 0;
            }
        }

        function prevTrack() { skipPrev(); }
        function nextTrack() { skipNext(); }

        // ── LRC Lyrics Engine ─────────────────────────────────
        let lrcLines   = [];
        let lrcCurrent = -1;

        function parseLRC(lrc) {
            if (!lrc) return [];
            const lines = lrc.split('\n').map(line => {
                const m = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
                if (!m) return null;
                const subSec = parseInt(m[3]) / (m[3].length === 3 ? 1000 : 100);
                return { time: parseInt(m[1]) * 60 + parseInt(m[2]) + subSec, text: m[4].trim() };
            }).filter(Boolean);
            return lines.filter(l => l.text.length > 0);
        }

        // ── Teleprompter lyrics engine ──────────────────────────
        let lineEls      = [];   // one div per lyric line
        let lineHeight   = 0;    // measured after first render
        const VISIBLE_R  = 3;    // lines to render above/below active

        function renderLyrics(lines) {
            const win    = document.getElementById('np-lyrics-window');
            const scroll = document.getElementById('np-lyrics-scroll');
            scroll.innerHTML = '';
            scroll.style.transform = 'translateY(0)';
            lineEls = [];
            lineHeight = 0;
            lrcCurrent = -1;

            if (!lines || !lines.length) { win.classList.remove('visible'); return; }

            // Build one div per lyric line
            lines.forEach((l, i) => {
                const div = document.createElement('div');
                div.className   = 'lyric-line';
                div.textContent = l.text;
                div.dataset.idx = i;
                scroll.appendChild(div);
                lineEls.push(div);
            });

            // Don't show window yet — wait for first active line
            // win stays hidden until updateLyrics fires with active >= 0

            // Measure line height after first paint
            requestAnimationFrame(() => {
                if (lineEls[0]) lineHeight = lineEls[0].getBoundingClientRect().height || 32;
                updateLyrics(audio.currentTime);
            });
        }

        function updateLyrics(t) {
            if (!lrcLines.length || !lineEls.length) return;
            let active = -1;
            for (let i = 0; i < lrcLines.length; i++) {
                if (t >= lrcLines[i].time) active = i; else break;
            }
            if (active === lrcCurrent) return;
            lrcCurrent = active;

            const scroll = document.getElementById('np-lyrics-scroll');
            const win    = document.getElementById('np-lyrics-window');

            // Show window on first active line
            if (active >= 0 && !win.classList.contains('visible')) {
                win.classList.add('visible');
            }

            // Step 1: Temporarily disable transitions and apply styles
            // so layout settles at new sizes before we measure
            scroll.style.transition = 'none';
            lineEls.forEach((el, i) => {
                const dist = i - active;
                if (Math.abs(dist) <= 3) {
                    el.removeAttribute('data-dist-far');
                    el.dataset.dist = String(dist);
                } else {
                    delete el.dataset.dist;
                    el.setAttribute('data-dist-far', '');
                }
                // Temporarily suppress line transitions during measurement
                el.style.transition = 'none';
            });

            // Step 2: Measure and scroll synchronously (no transition yet)
            requestAnimationFrame(() => {
                if (!lineEls[active]) return;
                const winH      = win.getBoundingClientRect().height || 120;
                const activeEl  = lineEls[active];
                const activeTop = activeEl.offsetTop;
                const activeH   = activeEl.getBoundingClientRect().height;
                const offsetY   = activeTop - winH / 2 + activeH / 2;
                scroll.style.transform = `translateY(${-offsetY}px)`;

                // Step 3: Re-enable transitions on next frame so animation plays from new position
                requestAnimationFrame(() => {
                    scroll.style.transition = '';
                    lineEls.forEach(el => { el.style.transition = ''; });
                });
            });
        }

        function formatTime(s) {
            if (isNaN(s) || s == null) return '';
            return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2,'0')}`;
        }

        // ── playTrack ─────────────────────────────────────────
        function playTrack(index) {
            if (!currentAlbum || !currentTracks[index]) return;
            const track = currentTracks[index];
            updateBarMeta(track, currentAlbum);
            audio.src = track.url;
            openNowPlaying(track, currentAlbum);
            audio.play()
                .then(() => {
                    setPlayState(true);
                    playerBar.classList.add('visible');
                    saveLastPlayed();
                    updateUpNext();
                })
                .catch(err => { console.error('Playback error:', err); showPlayError(); });
        }

        function showPlayError() {
            trackInnerEl.textContent = '⚠ Could not play — check audio source';
            setTimeout(() => {
                if (currentTracks[currentIndex]) trackInnerEl.textContent = currentTracks[currentIndex].title;
            }, 3000);
        }

        // ── Tap thumb → reopen modal ──────────────────────────
        thumbEl.addEventListener('click', () => {
            if (!audio.src) return;
            const track = currentTracks[currentIndex];
            if (track && currentAlbum) openNowPlaying(track, currentAlbum);
        });
        thumbPh.addEventListener('click', () => {
            if (!audio.src) return;
            const track = currentTracks[currentIndex];
            if (track && currentAlbum) openNowPlaying(track, currentAlbum);
        });

        // ── Modal progress seek + drag ────────────────────────
        // Two seek surfaces exist: #np-progress-wrap (on the cover, portrait)
        // and #np-progress-panel (in the content panel, landscape ≥600px).
        // Only one is visible at a time via CSS, but both need identical
        // drag behaviour — previously only np-progress-wrap had listeners,
        // so dragging the landscape panel bar did nothing itself and the
        // gesture fell through to the card's swipe-to-skip handler instead.
        (function () {
            const bar = document.getElementById('np-progress-bar');
            const panelBar = document.getElementById('np-progress-bar-panel');
            let dragging = false;
            let activeWrap = null;

            function seek(wrap, clientX) {
                if (!audio.duration) return;
                const r   = wrap.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
                // Disable transition for instant visual feedback
                bar.style.transition = 'none';
                bar.style.width = (pct * 100) + '%';
                if (panelBar) { panelBar.style.transition = 'none'; panelBar.style.width = (pct * 100) + '%'; }
                audio.currentTime = pct * audio.duration;
            }

            function startDrag(wrap, clientX) {
                dragging = true;
                activeWrap = wrap;
                wrap.classList.add('dragging');
                seek(wrap, clientX);
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                if (activeWrap) activeWrap.classList.remove('dragging');
                activeWrap = null;
                // Re-enable transition after drag ends
                bar.style.transition = '';
                if (panelBar) panelBar.style.transition = '';
            }

            [document.getElementById('np-progress-wrap'), document.getElementById('np-progress-panel')].forEach(wrap => {
                if (!wrap) return;

                // Mouse
                wrap.addEventListener('mousedown', e => {
                    startDrag(wrap, e.clientX); e.preventDefault();
                });

                // Touch
                wrap.addEventListener('touchstart', e => {
                    startDrag(wrap, e.touches[0].clientX); e.preventDefault();
                }, { passive: false });
                wrap.addEventListener('touchmove', e => {
                    if (dragging && activeWrap === wrap) { seek(wrap, e.touches[0].clientX); e.preventDefault(); }
                }, { passive: false });
                wrap.addEventListener('touchend', endDrag);
                wrap.addEventListener('touchcancel', endDrag);
            });

            document.addEventListener('mousemove', e => { if (dragging && activeWrap) seek(activeWrap, e.clientX); });
            document.addEventListener('mouseup', endDrag);
        })();

        // ── Mini bar seek ─────────────────────────────────────
        document.getElementById('player-seek-wrap').addEventListener('click', e => {
            if (!audio.duration) return;
            const r = e.currentTarget.getBoundingClientRect();
            audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
        });

        // ── Swipe left/right on modal to skip ─────────────────
        (function () {
            const card = document.getElementById('np-card');
            let sx = 0, sy = 0, down = false;

            card.addEventListener('pointerdown', e => {
                // Don't hijack drags that start on the seek bar, time labels, or
                // controls — those have their own drag/tap handling and must not
                // also trigger swipe-to-skip via bubbling.
                if (e.target.closest('#np-progress-wrap, .np-progress-panel, .np-top-group, .np-time, .np-controls-row, .np-back-btn, .np-share-btn, button')) return;
                sx = e.clientX; sy = e.clientY; down = true;
            });

            card.addEventListener('pointermove', e => {
                if (!down) return;
                const dx = e.clientX - sx, dy = e.clientY - sy;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 8) {
                    // Subtle rubber-band drag feedback
                    card.style.transition = 'none';
                    card.style.transform  = `scale(1) translateX(${dx * 0.1}px)`;
                }
            });

            function release(e) {
                if (!down) return;
                down = false;
                card.style.transition = '';
                card.style.transform  = '';
                const dx = e.clientX - sx, dy = e.clientY - sy;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 55) {
                    if (dx < 0) skipNext(); else skipPrev();
                }
            }

            card.addEventListener('pointerup',     release);
            card.addEventListener('pointercancel', () => { down = false; card.style.transform = ''; card.style.transition = ''; });
        })();

        // ── Keyboard shortcuts ────────────────────────────────
        let toastTimer = null;
        function showToast(msg) {
            const t = document.getElementById('kbd-toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
        }

        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch (e.code) {
                case 'Space':
                    e.preventDefault();
                    if (!audio.src) return;
                    togglePlay();
                    showToast(audio.paused ? '⏸ Paused' : '▶ Playing');
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    skipNext();
                    showToast('⏭ Next');
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    skipPrev();
                    showToast('⏮ Previous');
                    break;
                case 'Escape':
                    if (npOpen) { closeNowPlaying(); showToast('✕ Closed'); }
                    break;
                case 'KeyM':
                    // M = reopen Now Playing modal
                    if (audio.src && currentTracks[currentIndex] && currentAlbum) {
                        openNowPlaying(currentTracks[currentIndex], currentAlbum);
                        showToast('♪ Now Playing');
                    }
                    break;
            }
        });

        // ── Audio events ──────────────────────────────────────
        let lastSave = 0;
        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const pct = (audio.currentTime / audio.duration) * 100;
            seekFill.style.width = pct + '%';
            document.getElementById('np-progress-bar').style.width = pct + '%';
            const panelBar = document.getElementById('np-progress-bar-panel');
            if (panelBar) panelBar.style.width = pct + '%';
            document.getElementById('np-current').textContent  = formatTime(audio.currentTime);
            document.getElementById('np-duration').textContent = formatTime(audio.duration);
            if (npOpen) updateLyrics(audio.currentTime);
            // Save position at most once every 10 s
            const now = Date.now();
            if (now - lastSave > 10000) { lastSave = now; saveLastPlayed(); }
        });

        audio.addEventListener('ended', () => {
            if (queue.length > 0 && queuePos < queue.length - 1) {
                playQueueItem(queuePos + 1);
            } else if (currentAlbum && currentIndex < currentTracks.length - 1) {
                currentIndex++; playTrack(currentIndex);
            } else {
                setPlayState(false);
                playerBar.classList.remove('visible');
            }
        });

        // ── Screen wake lock — keep the display on while a track is playing ──
        // Only holds while this tab is in the foreground; it releases itself
        // when backgrounded and is re-acquired automatically when the tab
        // becomes visible again during playback.
        let wakeLock = null;

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (err) {
                // Fails silently if the page is hidden, battery saver is on, etc.
                wakeLock = null;
            }
        }

        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }

        audio.addEventListener('play',  requestWakeLock);
        audio.addEventListener('pause', releaseWakeLock);
        audio.addEventListener('ended', releaseWakeLock);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !audio.paused) {
                requestWakeLock();
            }
        });

        initMediaSessionHandlers();
        initialiseTransportIcons();

        playBtn.onclick = () => { if (!audio.src) return; togglePlay(); };
        nextBtn.onclick = skipNext;
        prevBtn.onclick = skipPrev;

        // ── Pending play from shared URL ───────────────
        const pendingPlay = (() => {
            const params = new URLSearchParams(location.search);
            const albumId = params.get('play');
            const trackIdx = params.get('track');
            if (albumId) history.replaceState({}, '', location.pathname);
            return albumId ? { albumId: parseInt(albumId), trackIndex: trackIdx !== null ? parseInt(trackIdx) : 0 } : null;
        })();

        // ── Share ──────────────────────────────────────
        function shareCurrentTrack(e) {
            if (!currentAlbum || currentTracks.length === 0) return;
            shareTrack(e, currentAlbum.id, currentIndex, currentTracks[currentIndex].title);
        }

        function shareTrack(e, albumId, trackIndex, trackTitle) {
            e.stopPropagation();
            const url     = `${location.origin}/?play=${albumId}&track=${trackIndex}`;
            const msgText = `Listen to "${trackTitle}" on Generify Music`;
            if (navigator.share) {
                // Pass url separately so AirDrop sends a clickable link
                // text is kept short (no URL) to avoid duplication on iOS
                navigator.share({ title: trackTitle, text: msgText, url }).catch(() => {});
            } else {
                navigator.clipboard.writeText(url).then(() => showToast('✓ Link copied!')).catch(() => {
                    prompt('Copy this link:', url);
                });
            }
        }

        // ── Auto-play from URL (?play=albumId&track=trackIndex) ─────────────
        function checkAutoPlay() {
            if (!pendingPlay || !allAlbums.length) return;
            const album = allAlbums.find(a => a.id === pendingPlay.albumId);
            if (!album || !album.tracks.length) return;

            const trackIndex = Math.min(pendingPlay.trackIndex, album.tracks.length - 1);
            const track = album.tracks[trackIndex];
            if (!track) return;

            // Navigate to the correct lens room
            activeLens = track.primaryLens || FULL_LIBRARY;
            buildFilterBar(allAlbums);
            renderLensRows(allAlbums, activeLens);
            updateLensActionLabels();

            // Set up player bar
            currentAlbum  = album;
            currentTracks = album.tracks;
            currentIndex  = trackIndex;
            updateBarMeta(track, album);
            playerBar.classList.add('visible');

            // Highlight the matching card once it's in the DOM
            requestAnimationFrame(() => {
                const card = document.querySelector(`.album-card[data-album-id="${album.id}"][data-track-index="${trackIndex}"]`);
                if (card) { card.classList.add('active'); activeCard = card; }
            });

            // Open the modal immediately — no timer, so restoreLastPlayed can't race
            openNowPlaying(track, album);

            // Re-assert audio src here (in case anything else changed it), then attempt play
            audio.src = track.url;
            audio.play()
                .then(() => { setPlayState(true); saveLastPlayed(); updateUpNext(); })
                .catch(() => { setPlayState(false); showToast('▶ Tap play to start'); });
        }

        loadAlbums();
    </script>

    <!-- Build tag — bump this string on every deploy you want to verify.
         Fixed position, low contrast, click-through, sits under the modal. -->
    <div id="build-tag" style="position:fixed;bottom:6px;right:10px;font-size:0.65rem;line-height:1;color:rgba(255,255,255,0.7);opacity:1;text-shadow:0 1px 3px rgba(0,0,0,0.8);pointer-events:none;z-index:999;font-family:monospace;">v2.15.0</div>
</body>
