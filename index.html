<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Generify Music</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');
        :root {
            --red:      #e8000f;
            --red-glow: rgba(232, 0, 15, 0.35);
            --bg:       #080a0c;
            --surface:  #0f1114;
            --surface2: #181b1f;
            --border:   rgba(232, 0, 15, 0.18);
            --text:     #f0f0f0;
            --muted:    #6b7280;
            --player-h: 88px;
            --card-w:   160px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(var(--player-h) + 24px);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* ── Header ── */
        header {
            position: relative;
            display: flex;
            align-items: center;
            padding: 18px 28px;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(232,0,15,0.07) 0%, transparent 100%);
            z-index: 1;
            gap: 16px;
        }

        header::after {
            content: '';
            position: absolute;
            top: -40px;
            left: 60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(232,0,15,0.18) 0%, transparent 70%);
            pointer-events: none;
        }

        .wolf-logo {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow:
                0 0 0 1px var(--border),
                0 0 20px var(--red-glow),
                0 0 50px rgba(232,0,15,0.1);
            animation: pulse-ring 3s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { box-shadow: 0 0 0 1px var(--border), 0 0 20px var(--red-glow), 0 0 50px rgba(232,0,15,0.1); }
            50%       { box-shadow: 0 0 0 1px rgba(232,0,15,0.5), 0 0 32px rgba(232,0,15,0.55), 0 0 70px rgba(232,0,15,0.2); }
        }

        .header-text { display: flex; flex-direction: column; line-height: 1; }

        .brand-name {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 2.2rem;
            letter-spacing: 0.12em;
            color: var(--text);
            text-shadow: 0 0 30px var(--red-glow);
        }

        .brand-sub {
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--red);
            font-weight: 500;
            margin-top: 2px;
        }

        .header-divider {
            width: 1px;
            height: 36px;
            background: var(--border);
            margin: 0 4px;
            flex-shrink: 0;
        }

        .header-label {
            font-size: 0.7rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 300;
        }

        .header-centre {
            display: flex;
            align-items: center;
            gap: 16px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .header-spacer {
            width: 56px; /* matches wolf-logo width */
            flex-shrink: 0;
        }

        /* ── Main ── */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 20px 0;
            position: relative;
            z-index: 1;
        }

        /* ── Genre Row ── */
        .genre-section { margin-bottom: 36px; }

        .genre-header {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 14px;
            padding-left: 2px;
        }

        .genre-title {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.3rem;
            letter-spacing: 0.08em;
            color: var(--text);
        }

        .genre-count {
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .genre-rule {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Filter Pills ── */
        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 0 2px 20px;
        }

        .filter-pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.18);
            color: #c0c0c0;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 7px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            white-space: nowrap;
        }

        .filter-pill:hover {
            border-color: rgba(232,0,15,0.6);
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .filter-pill.active {
            background: var(--red);
            border-color: var(--red);
            color: white;
            box-shadow: 0 0 12px var(--red-glow);
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .action-pill {
            background: transparent;
            border: 1px solid rgba(232,0,15,0.4);
            color: var(--red);
            font-family: inherit;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-pill:hover {
            background: var(--red);
            color: white;
        }

        .album-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .album-row::-webkit-scrollbar { height: 3px; }
        .album-row::-webkit-scrollbar-track { background: var(--surface); }
        .album-row::-webkit-scrollbar-thumb { background: #7a000a; border-radius: 2px; }

        /* ── Album Card ── */
        .album-card {
            flex: 0 0 var(--card-w);
            width: var(--card-w);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            scroll-snap-align: start;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            animation: fadeUp 0.4s ease both;
        }

        .album-card:hover {
            transform: translateY(-4px);
            border-color: rgba(232,0,15,0.5);
            box-shadow: 0 8px 32px rgba(232,0,15,0.15);
        }

        .album-card.active {
            border-color: var(--red);
            box-shadow: 0 0 0 1px var(--red), 0 8px 32px rgba(232,0,15,0.25);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .album-cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            overflow: hidden;
        }

        .album-cover {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .album-card:hover .album-cover { transform: scale(1.06); }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .album-card:hover .play-overlay { opacity: 1; }

        .play-overlay svg {
            width: 44px; height: 44px;
            filter: drop-shadow(0 0 8px rgba(232,0,15,0.8));
        }

        .album-info { padding: 10px 12px 12px; }

        .album-title {
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .album-artist {
            font-size: 0.74rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .state-msg {
            color: var(--muted);
            font-size: 0.9rem;
            padding: 40px 0;
            text-align: center;
        }

        /* ── Player Bar ── */
        .player-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--player-h);
            background: rgba(10,11,13,0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            gap: 16px;
            z-index: 100;
        }

        .player-bar.visible { display: flex; }

        .player-bar::before {
            content: '';
            position: absolute;
            top: -1px; left: 0;
            height: 2px;
            width: var(--progress, 0%);
            background: var(--red);
            box-shadow: 0 0 8px var(--red-glow);
            transition: width 0.5s linear;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            flex: 1;
        }

        .player-thumb {
            width: 48px; height: 48px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
            cursor: pointer;
        }

        .player-meta { min-width: 0; }

        .player-track {
            font-weight: 500;
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 0.74rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            font-size: 1.1rem;
        }

        .ctrl-btn:hover { color: var(--text); background: var(--surface2); }

        .ctrl-btn.primary {
            width: 48px; height: 48px;
            background: var(--red);
            color: white;
            box-shadow: 0 0 16px var(--red-glow);
        }

        .ctrl-btn.primary:hover { background: #ff1a26; }
        .ctrl-btn:active { transform: scale(0.93); }

        audio { display: none; }

        @media (max-width: 500px) {
            .brand-name  { font-size: 1.7rem; }
            .wolf-logo   { width: 44px; height: 44px; }
            :root        { --card-w: 136px; }
            .player-bar  { padding: 0 14px; }
            .header-divider, .header-label { display: none; }
        }

        /* ── Now Playing Modal ── */
        .now-playing-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: background 0.4s ease;
        }

        .now-playing-overlay.open {
            background: rgba(0,0,0,0.82);
            pointer-events: all;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .now-playing-card {
            position: relative;
            width: min(560px, 92vw);
            border-radius: 20px;
            overflow: hidden;
            transform: scale(0.3) translateY(60px);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease, width 0.4s ease;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
        }



        .now-playing-overlay.open .now-playing-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .np-cover {
            width: 100%;
            height: 100%;
            min-height: 320px;
            object-fit: cover;
            display: block;
        }

        /* Dark gradient over bottom of cover */
        .np-gradient {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 65%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, transparent 100%);
            pointer-events: none;
        }

        .np-content {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px 24px 24px;
        }

        .np-track {
            font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.06em;
            color: white;
            line-height: 1.1;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .np-artist {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.65);
            margin-bottom: 16px;
            letter-spacing: 0.05em;
        }

        /* Progress bar */
        .np-progress-wrap {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            margin-bottom: 18px;
            cursor: pointer;
            position: relative;
        }

        .np-progress-bar {
            height: 100%;
            background: var(--red);
            border-radius: 2px;
            width: 0%;
            box-shadow: 0 0 6px var(--red-glow);
            transition: width 0.5s linear;
            pointer-events: none;
        }

        .np-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: rgba(255,255,255,0.45);
            margin-top: 4px;
            margin-bottom: 16px;
        }

        .np-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .np-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            font-size: 1.4rem;
            width: 48px; height: 48px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: color 0.15s, background 0.15s, transform 0.1s;
        }

        .np-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .np-btn:active { transform: scale(0.9); }

        .np-btn.play {
            width: 64px; height: 64px;
            background: var(--red);
            color: white;
            font-size: 1.6rem;
            box-shadow: 0 0 24px var(--red-glow);
        }

        .np-btn.play:hover { background: #ff1a26; }

        /* Close button */
        .np-close {
            position: absolute;
            top: 14px; right: 14px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: rgba(255,255,255,0.8);
            width: 34px; height: 34px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
            z-index: 10;
        }

        .np-close:hover { background: rgba(0,0,0,0.8); color: white; }

        /* ── Now Playing Split Layout ── */
        .np-inner {
            display: flex;
            width: 100%;
            min-height: 320px;
            height: 100%;
        }

        /* Cover side */
        .np-cover-side {
            flex: 0 0 320px;
            width: 320px;
            position: relative;
        }

        .np-inner:not(.has-lyrics) .np-cover-side {
            flex: 0 0 100%;
            width: 100%;
        }

        /* Lyrics side */
        .np-lyrics-side {
            flex: 1;
            display: none;
            flex-direction: column;
            background: rgba(0,0,0,0.92);
            padding: 28px 20px;
            overflow: hidden;
        }

        .np-inner.has-lyrics .np-lyrics-side {
            display: flex;
        }

        .np-lyrics-title {
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--red);
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        /* Lyrics Panel */
        .np-lyrics {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            padding: 20px 0;
        }
        .np-lyrics::-webkit-scrollbar { display: none; }

        .lyric-line {
            text-align: center;
            font-size: 1rem;
            color: rgba(255,255,255,0.3);
            line-height: 2;
            padding: 2px 8px;
            transition: color 0.8s ease, font-size 0.6s ease, font-weight 0.6s ease;
        }
        .lyric-line.active {
            color: white;
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 0 0 16px rgba(232,0,15,0.7);
        }
        .lyric-line.past { color: rgba(255,255,255,0.18); }

        /* Mobile: stack vertically */
        @media (max-width: 600px) {
            .np-inner.has-lyrics { flex-direction: column; }
            .np-inner.has-lyrics .np-cover-side { flex: 0 0 auto; width: 100%; min-height: 0; }
            .np-inner.has-lyrics .np-cover-side .np-cover { min-height: 0; height: 200px; }
            .np-inner.has-lyrics .np-lyrics-side { padding: 16px; min-height: 200px; }
            .lyric-line { font-size: 0.88rem; line-height: 1.8; }
            .lyric-line.active { font-size: 1rem; }
            .now-playing-card.expanded { width: 92vw; }
        }
    </style>
</head>
<body>

    <header>
        <!-- Left: Wolf logo -->
        <img src="/covers/wolf-logo.png" alt="Generify Wolf Logo" class="wolf-logo"
             onerror="this.style.display='none'">
        <!-- Centre: Brand -->
        <div class="header-centre">
            <div class="header-text">
                <span class="brand-name">Generify</span>
                <span class="brand-sub">Data Intelligence</span>
            </div>
            <div class="header-divider"></div>
            <span class="header-label">Music Library</span>
        </div>
        <!-- Right: spacer to balance logo -->
        <div class="header-spacer"></div>
    </header>

    <main>
        <div class="filter-bar" id="filter-bar"></div>
        <div id="main-content">
            <p class="state-msg">Loading…</p>
        </div>
    </main>

    <!-- ── Now Playing Modal ── -->
    <div class="now-playing-overlay" id="np-overlay" onclick="handleOverlayClick(event)">
        <div class="now-playing-card" id="np-card">
            <img class="np-cover" id="np-cover" src="" alt="">
            <div class="np-gradient"></div>
            <button class="np-close" onclick="closeNowPlaying()">✕</button>
            <div class="np-content">
                <div class="np-track" id="np-track">—</div>
                <div class="np-artist" id="np-artist">—</div>
                <div class="np-progress-wrap" id="np-progress-wrap">
                    <div class="np-progress-bar" id="np-progress-bar"></div>
                </div>
                <div class="np-time">
                    <span id="np-current">0:00</span>
                    <span id="np-duration">0:00</span>
                </div>
                <div class="np-lyrics-window" id="np-lyrics-window">
                    <div class="lyric-line prev"  id="ll-prev"></div>
                    <div class="lyric-line active" id="ll-active"></div>
                    <div class="lyric-line next1"  id="ll-next1"></div>
                    <div class="lyric-line next2"  id="ll-next2"></div>
                    <div class="lyric-line next3"  id="ll-next3"></div>
                </div>
                <div class="np-controls">
                    <button class="np-btn" onclick="prevTrack()" title="Previous">⏮</button>
                    <button class="np-btn play" id="np-play-btn" onclick="togglePlay()">▶</button>
                    <button class="np-btn" onclick="nextTrack()" title="Next">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="player-bar" id="player-bar">
        <div class="player-info">
            <img id="player-thumb" class="player-thumb" src="" alt="">
            <div class="player-meta">
                <div id="player-track" class="player-track">—</div>
                <div id="player-artist" class="player-artist">—</div>
            </div>
        </div>
        <div class="controls">
            <button class="ctrl-btn" id="prev-btn" title="Previous">⏮</button>
            <button class="ctrl-btn primary" id="play-btn" title="Play / Pause">▶</button>
            <button class="ctrl-btn" id="next-btn" title="Next">⏭</button>
        </div>
        <audio id="audio-player"></audio>
    </div>

    <script>
        // ── Queue system ───────────────────────────────────
        // queue = flat array of { album, track, trackIndex }
        let queue        = [];
        let queuePos     = 0;
        let isShuffled   = false;

        let currentAlbum  = null;
        let currentTracks = [];
        let currentIndex  = 0;
        let activeCard    = null;

        // Build a flat queue from an array of albums
        function buildQueue(albums, shuffle = false) {
            queue = [];
            albums.forEach(album => {
                album.tracks.forEach((track, i) => {
                    queue.push({ album, track, trackIndex: i });
                });
            });
            if (shuffle) {
                for (let i = queue.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [queue[i], queue[j]] = [queue[j], queue[i]];
                }
            }
            queuePos  = 0;
            isShuffled = shuffle;
        }

        function playQueue(albums, shuffle = false) {
            if (!albums.length) return;
            buildQueue(albums, shuffle);
            playQueueItem(0);
        }

        function playQueueItem(pos) {
            if (pos < 0 || pos >= queue.length) return;
            queuePos = pos;
            const { album, track, trackIndex } = queue[pos];

            // Update active card
            if (activeCard) { activeCard.classList.remove('active'); updateCardOverlay(activeCard, false); }
            const newCard = document.querySelector(`.album-card[data-album-id="${album.id}"]`);
            if (newCard) { newCard.classList.add('active'); activeCard = newCard; }

            currentAlbum  = album;
            currentTracks = album.tracks;
            currentIndex  = trackIndex;

            trackEl.textContent  = track.title;
            artistEl.textContent = album.artist;
            thumbEl.src          = album.cover;
            audio.src            = track.url;
            audio.play()
                .then(() => {
                    playBtn.textContent = '⏸';
                    playerBar.classList.add('visible');
                    updateCardOverlay(activeCard, true);
                    openNowPlaying(track, album);
                })
                .catch(err => { console.error(err); alert('Could not play audio.'); });
        }

        // Play/Shuffle — context aware: uses active genre filter
        function getActiveAlbums() {
            return activeGenre === 'All'
                ? allAlbums
                : allAlbums.filter(a => (a.genre || 'Other') === activeGenre);
        }

        function playAll()     { playQueue(getActiveAlbums(), false); }
        function shuffleAll()  { playQueue(getActiveAlbums(), true); }



        const mainEl    = document.getElementById('main-content');
        const playerBar = document.getElementById('player-bar');
        const audio     = document.getElementById('audio-player');
        const playBtn   = document.getElementById('play-btn');
        const prevBtn   = document.getElementById('prev-btn');
        const nextBtn   = document.getElementById('next-btn');
        const trackEl   = document.getElementById('player-track');
        const artistEl  = document.getElementById('player-artist');
        const thumbEl   = document.getElementById('player-thumb');

        let allAlbums   = [];
        let activeGenre = 'Funny'; // default

        async function loadAlbums() {
            try {
                const res = await fetch('/api/albums');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                allAlbums = await res.json();
                buildFilterBar(allAlbums);
                renderGenreRows(allAlbums, activeGenre);
            } catch (err) {
                mainEl.innerHTML = `<p class="state-msg">Could not load albums. ${err.message}</p>`;
            }
        }

        function buildFilterBar(albums) {
            const bar    = document.getElementById('filter-bar');
            const genres = ['All', ...new Set(albums.map(a => a.genre || 'Other'))];
            bar.innerHTML = '';

            // Genre pills
            genres.forEach(genre => {
                const pill = document.createElement('button');
                pill.className = 'filter-pill' + (genre === activeGenre ? ' active' : '');
                pill.textContent = genre;
                pill.onclick = () => {
                    activeGenre = genre;
                    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    renderGenreRows(allAlbums, activeGenre);
                    const label = activeGenre === 'All' ? 'Play All' : `Play ${activeGenre}`;
                    const playAllBtn = document.getElementById('play-all-btn');
                    if (playAllBtn) playAllBtn.innerHTML = `▶ ${label}`;
                };
                bar.appendChild(pill);
            });

            // Global action buttons
            const actions = document.createElement('div');
            actions.className = 'filter-actions';
            actions.innerHTML = `
                <button class="action-pill" id="play-all-btn" onclick="playAll()">▶ Play All</button>
                <button class="action-pill" id="shuffle-btn" onclick="shuffleAll()">⇄ Shuffle</button>
            `;
            bar.appendChild(actions);
        }

        function renderGenreRows(albums, genreFilter) {
            if (!albums.length) {
                mainEl.innerHTML = '<p class="state-msg">No albums found.</p>';
                return;
            }

            // Filter albums
            const filtered = genreFilter === 'All'
                ? albums
                : albums.filter(a => (a.genre || 'Other') === genreFilter);

            // Group by genre
            const groups = {};
            filtered.forEach(album => {
                const genre = album.genre || 'Other';
                if (!groups[genre]) groups[genre] = [];
                groups[genre].push(album);
            });

            mainEl.innerHTML = '';
            let cardIndex = 0;

            Object.entries(groups).forEach(([genre, genreAlbums]) => {
                const section = document.createElement('section');
                section.className = 'genre-section';
                const genreKey = genre.replace(/[^a-z0-9]/gi, '_');
                section.innerHTML = `
                    <div class="genre-header">
                        <span class="genre-title">${genre}</span>
                        <span class="genre-count">${genreAlbums.length} album${genreAlbums.length !== 1 ? 's' : ''}</span>
                        <div class="genre-rule"></div>

                    </div>
                    <div class="album-row" id="genre-row-${genreKey}"></div>
                `;

                const row = section.querySelector('.album-row');

                genreAlbums.forEach(album => {
                    const card = document.createElement('div');
                    card.className = 'album-card';
                    card.dataset.albumId = album.id;
                    card.style.animationDelay = `${cardIndex * 50}ms`;
                    card.innerHTML = `
                        <div class="album-cover-wrap">
                            <img class="album-cover" src="${album.cover}" alt="${album.title}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%230f1114%22 width=%221%22 height=%221%22/></svg>'">
                            <div class="play-overlay" data-overlay>
                                <svg viewBox="0 0 48 48" fill="none" data-play-icon>
                                    <circle cx="24" cy="24" r="23" stroke="white" stroke-width="1.5" opacity="0.6"/>
                                    <path class="play-path" d="M19 16l14 8-14 8V16z" fill="white"/>
                                    <g class="pause-bars" style="display:none">
                                        <rect x="16" y="14" width="5" height="20" rx="1.5" fill="white"/>
                                        <rect x="27" y="14" width="5" height="20" rx="1.5" fill="white"/>
                                    </g>
                                </svg>
                            </div>
                        </div>
                        <div class="album-info">
                            <div class="album-title">${album.title}</div>
                            <div class="album-artist">${album.artist}</div>
                        </div>
                    `;
                    card.dataset.genre = genreKey;
                    card.onclick = () => {
                        const isSameAlbum = currentAlbum && currentAlbum.id === album.id;
                        if (isSameAlbum) {
                            // Toggle play/pause on same album
                            if (audio.paused) {
                                audio.play();
                                playBtn.textContent = '⏸';
                                document.getElementById('np-play-btn').textContent = '⏸';
                                updateCardOverlay(card, true);
                                // Reopen modal if closed
                                const track = currentTracks[currentIndex];
                                if (track) openNowPlaying(track, currentAlbum);
                            } else {
                                audio.pause();
                                playBtn.textContent = '▶';
                                document.getElementById('np-play-btn').textContent = '▶';
                                updateCardOverlay(card, false);
                            }
                        } else {
                            // New album — reset previous card overlay
                            if (activeCard) {
                                activeCard.classList.remove('active');
                                updateCardOverlay(activeCard, false);
                            }
                            card.classList.add('active');
                            activeCard = card;
                            loadAndPlay(album);
                        }
                    };
                    row.appendChild(card);
                    cardIndex++;
                });

                mainEl.appendChild(section);
            });
        }

        function loadAndPlay(album) {
            currentAlbum  = album;
            currentTracks = album.tracks;
            currentIndex  = 0;
            playTrack(0);
        }

        function updateCardOverlay(card, isPlaying) {
            if (!card) return;
            const playPath   = card.querySelector('.play-path');
            const pauseBars  = card.querySelector('.pause-bars');
            if (!playPath || !pauseBars) return;
            playPath.style.display  = isPlaying ? 'none' : '';
            pauseBars.style.display = isPlaying ? '' : 'none';
        }

        // ── Now Playing Modal ───────────────────────────────
        let npOpen = false;

        async function openNowPlaying(track, album) {
            const overlay = document.getElementById('np-overlay');
            document.getElementById('np-cover').src    = album.cover;
            document.getElementById('np-track').textContent  = track.title;
            document.getElementById('np-artist').textContent = album.artist;
            document.getElementById('np-play-btn').textContent = audio.paused ? '▶' : '⏸';
            overlay.classList.add('open');
            npOpen = true;

            // Fetch .lrc file if available
            lrcLines = [];
            renderLyrics([]);
            if (track.lrc) {
                try {
                    const res = await fetch(track.lrc);
                    if (res.ok) {
                        const text = await res.text();
                        lrcLines = parseLRC(text);
                        renderLyrics(lrcLines);
                        updateLyrics(audio.currentTime);
                    }
                } catch (e) {
                    console.warn('Could not load lyrics:', e);
                }
            }
        }

        function closeNowPlaying() {
            document.getElementById('np-overlay').classList.remove('open');
            npOpen = false;
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('np-overlay')) closeNowPlaying();
        }

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                document.getElementById('np-play-btn').textContent = '⏸';
                updateCardOverlay(activeCard, true);
            } else {
                audio.pause();
                playBtn.textContent = '▶';
                document.getElementById('np-play-btn').textContent = '▶';
                updateCardOverlay(activeCard, false);
                // Modal stays open on pause — user can resume
            }
        }

        function prevTrack() { prevBtn.click(); }
        function nextTrack() { nextBtn.click(); }


        // ── LRC Lyrics Engine ───────────────────────────────
        let lrcLines   = [];
        let lrcCurrent = -1;

        function parseLRC(lrc) {
            if (!lrc) return [];
            const lines = lrc.split('\n').map(line => {
                const m = line.match(/\[(\d{2}):(\d{2})\.(\d{2})\](.*)/);
                if (!m) return null;
                const time = parseInt(m[1]) * 60 + parseInt(m[2]) + parseInt(m[3]) / 100;
                return { time, text: m[4].trim() };
            }).filter(Boolean);

            // Remove blank spacer lines from the timed array entirely
            // so they don't consume a timestamp slot and throw off timing
            return lines.filter(l => l.text.length > 0);
        }

        function renderLyrics(lines) {
            const win = document.getElementById('np-lyrics-window');
            if (!lines || !lines.length) {
                win.classList.remove('visible');
                return;
            }
            win.classList.add('visible');
            lrcCurrent = -1;
            updateLyrics(audio.currentTime);
        }

        function updateLyrics(currentTime) {
            if (!lrcLines.length) return;
            let active = -1;
            for (let i = 0; i < lrcLines.length; i++) {
                if (currentTime >= lrcLines[i].time) active = i;
                else break;
            }
            if (active === lrcCurrent) return;
            lrcCurrent = active;
            const get = i => (lrcLines[i] ? lrcLines[i].text : '');
            document.getElementById('ll-prev').textContent   = get(active - 1);
            document.getElementById('ll-active').textContent = get(active);
            document.getElementById('ll-next1').textContent  = get(active + 1);
            document.getElementById('ll-next2').textContent  = get(active + 2);
            document.getElementById('ll-next3').textContent  = get(active + 3);
        }
        function formatTime(s) {
            if (isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60).toString().padStart(2, '0');
            return `${m}:${sec}`;
        }

        // Tap mini player bar thumb to re-open modal
        document.getElementById('player-thumb').addEventListener('click', () => {
            if (!audio.src) return;
            const track = currentTracks[currentIndex];
            if (track && currentAlbum) openNowPlaying(track, currentAlbum);
        });

        // Progress seek in modal
        document.getElementById('np-progress-wrap').addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct  = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        });

        function playTrack(index) {
            if (!currentAlbum || !currentTracks[index]) return;
            const track = currentTracks[index];
            trackEl.textContent  = track.title;
            artistEl.textContent = currentAlbum.artist;
            thumbEl.src          = currentAlbum.cover;
            audio.src            = track.url;
            audio.play()
                .then(() => {
                    playBtn.textContent = '⏸';
                    playerBar.classList.add('visible');
                    updateCardOverlay(activeCard, true);
                    openNowPlaying(track, currentAlbum);
                })
                .catch(err => { console.error('Playback error:', err); alert('Could not play audio.'); });
        }

        audio.addEventListener('timeupdate', () => {
            if (!audio.duration) return;
            const pct = audio.currentTime / audio.duration * 100;
            playerBar.style.setProperty('--progress', pct + '%');
            document.getElementById('np-progress-bar').style.width = pct + '%';
            document.getElementById('np-current').textContent  = formatTime(audio.currentTime);
            document.getElementById('np-duration').textContent = formatTime(audio.duration);
            if (npOpen) updateLyrics(audio.currentTime);
        });

        audio.addEventListener('ended', () => {
            // Try queue first (play all / shuffle mode)
            if (queue.length > 0 && queuePos < queue.length - 1) {
                playQueueItem(queuePos + 1);
            } else if (currentAlbum && currentIndex < currentTracks.length - 1) {
                currentIndex++; playTrack(currentIndex);
            } else {
                playBtn.textContent = '▶';
                updateCardOverlay(activeCard, false);
            }
        });

        playBtn.onclick = () => {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
                document.getElementById('np-play-btn').textContent = '⏸';
                updateCardOverlay(activeCard, true);
            } else {
                audio.pause();
                playBtn.textContent = '▶';
                document.getElementById('np-play-btn').textContent = '▶';
                updateCardOverlay(activeCard, false);
            }
        };

        nextBtn.onclick = () => {
            if (queue.length > 0 && queuePos < queue.length - 1) {
                playQueueItem(queuePos + 1);
            } else if (currentAlbum && currentIndex < currentTracks.length - 1) {
                currentIndex++; playTrack(currentIndex);
            }
        };

        prevBtn.onclick = () => {
            if (audio.currentTime > 3) { audio.currentTime = 0; return; }
            if (queue.length > 0 && queuePos > 0) {
                playQueueItem(queuePos - 1);
            } else if (currentAlbum && currentIndex > 0) {
                currentIndex--; playTrack(currentIndex);
            }
        };

        loadAlbums();
    </script>
</body>
</html>
